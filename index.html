async function exportData(){try{const profile=getProfile();const photos=await recGetAllPhotos();const backup={version:3,exportedAt:new Date().toISOString(),profile:profile||{},workouts,recoveryLogs,photos};const json=JSON.stringify(backup,null,2);const blob=new Blob([json],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`HIT-log-${today()}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exported!',false);}catch(err){toast('Export failed: '+err.message,true);}}
function handleImport(evt){const file=evt.target.files[0];if(!file)return;const r=new FileReader();r.onload=e=>{try{const raw=JSON.parse(e.target.result);const sessions=Array.isArray(raw)?raw:raw.workouts;const profile=Array.isArray(raw)?null:(raw.profile||null);if(!Array.isArray(sessions))throw 0;showSheet('Replace all data?',`This will overwrite your ${workouts.length} existing sessions with the ${sessions.length} sessions in the file. This cannot be undone.`,'Replace Data',()=>{workouts=sessions.map(w=>normaliseBar(normaliseBelt(normaliseNames({...w,method:w.method||(ROT.includes(w.type)?'consolidated':'legacy')}))));save();if(profile&&Object.keys(profile).length){localStorage.setItem('hd_profile',JSON.stringify(profile));}
if(Array.isArray(raw.recoveryLogs)){recoveryLogs=raw.recoveryLogs;saveRecovery();}
if(raw.photos&&typeof raw.photos==='object'){Object.entries(raw.photos).forEach(([id,dataUrl])=>recSavePhoto(id,dataUrl));}
toast(`Loaded ${sessions.length} sessions`,false);go('home');});}catch{toast('Invalid JSON file',true);}};r.readAsText(file);evt.target.value='';}

function showHelpManual(){const ov=document.createElement('div');ov.id='help-ov';ov.className='wkmod-analysis-overlay';ov.onclick=e=>{if(e.target===ov)ov.remove();};ov.innerHTML=`<div class="wkmod-analysis-sheet" style="max-height:90vh"><div class="wkmod-analysis-head"><div><div class="wkmod-analysis-title">User Manual</div><div class="wkmod-analysis-subtitle">Heavy Duty HIT Tracker</div></div><button style="background:none;border:none;color:var(--text-3);font-size:22px;cursor:pointer;padding:4px" onclick="document.getElementById('help-ov').remove()">&times;</button></div><div class="wkmod-analysis-body"><div style="font-size:13px;line-height:1.6;color:var(--text-2)">
<h4 style="color:var(--text);font-size:14px;margin:0 0 4px">Getting Started</h4>
<p style="margin:0 0 14px">Tap <strong>Start Workout</strong> on the home screen to log your next session. The app rotates through the Consolidated split (A1 → B1 → A2 → B2) based on your history.</p>
<h4 style="color:var(--text);font-size:14px;margin:0 0 4px">Logging a Workout</h4>
<p style="margin:0 0 6px">For each exercise, tap the <strong>Weight</strong> and <strong>Reps</strong> fields to enter your numbers via the numpad. Weight is pre-filled from your last session — reps must always be entered. You can't save a workout with missing reps.</p>
<p style="margin:0 0 14px">The <strong>"Last:"</strong> hint shows your most recent performance. For body weight exercises with a belt, it shows the combined total.</p>
<h4 style="color:var(--text);font-size:14px;margin:0 0 4px">Calendar</h4>
<p style="margin:0 0 14px">Tap any date in the History tab to open the calendar. Red dots mark training days — tap one to jump straight to that session.</p>
<h4 style="color:var(--text);font-size:14px;margin:0 0 4px">Workout Methods</h4>
<p style="margin:0 0 14px">Two built-in methods — Consolidated and Legacy — drawn from exercises within the HIT framework. Follow them as prescribed, modify them to suit your training, or build your own from scratch using <strong>Custom Workouts</strong> in Settings.</p>
<h4 style="color:var(--text);font-size:14px;margin:0 0 4px">Editing Workouts</h4>
<p style="margin:0 0 14px">Tap any workout row's <strong>three-dot menu</strong> (⋮) to modify its exercises. Changes get an <strong>EDITED</strong> badge. Tap <strong>AI REVIEW</strong> to have Claude analyse your changes through the lens of Heavy Duty principles.</p>
<h4 style="color:var(--text);font-size:14px;margin:0 0 4px">Exercise Variations</h4>
<p style="margin:0 0 14px">Some exercises offer variations (e.g. Pec Deck / Dumbbell Flyes). Pick which one you performed using the chips below the exercise name.</p>
<h4 style="color:var(--text);font-size:14px;margin:0 0 4px">Body Weight Exercises</h4>
<p style="margin:0 0 14px">For Dips, Pull-ups and similar, toggle the <strong>Weight Belt</strong> switch to log added belt weight. The hint and detail view show the combined total (BW + belt).</p>
<h4 style="color:var(--text);font-size:14px;margin:0 0 4px">Recovery Sessions</h4>
<p style="margin:0 0 14px">In the <strong>Insights</strong> tab, log light cardio and movement sessions between training days. Attach a photo and Claude reads the equipment stats (distance, speed, heart rate, calories) directly from the display. Stats convert to your preferred units on the fly.</p>
<h4 style="color:var(--text);font-size:14px;margin:0 0 4px">AI Insights</h4>
<p style="margin:0 0 14px">Go to <strong>Settings → AI Analysis</strong> and paste your Anthropic API key. The key stays in your browser only. The Insights tab gives you training analysis, progressive overload trends and HIT-specific coaching powered by Claude.</p>
<h4 style="color:var(--text);font-size:14px;margin:0 0 4px">Appearance</h4>
<p style="margin:0 0 14px">Switch between <strong>Dark</strong>, <strong>Light</strong> and <strong>Auto</strong> in Settings. Dark is optimised for the gym, Light is readable in direct sunlight, and Auto follows your phone's system setting. You can also toggle between <strong>Metric (kg)</strong> and <strong>Imperial (lbs)</strong> — all weights and recovery stats convert on the fly.</p>
<h4 style="color:var(--text);font-size:14px;margin:0 0 4px">Data & Backups</h4>
<p style="margin:0 0 4px"><strong>Export JSON</strong> — Downloads all your data as a single file. Do this regularly.</p>
<p style="margin:0 0 4px"><strong>Import JSON</strong> — Replaces all data from a backup file.</p>
<p style="margin:0 0 0"><strong>Google Drive</strong> — Auto-backup after every workout. When the session expires, the app shows a reconnect screen — tap <strong>Connect</strong> in Settings to re-authenticate.</p>
</div></div><div class="wkmod-analysis-footer"><button class="btn-save" style="margin:0;width:100%" onclick="document.getElementById('help-ov').remove()">Done</button></div></div>`;document.body.appendChild(ov);}

function getProfile(){try{return JSON.parse(localStorage.getItem('hd_profile')||'null');}catch(e){return null;}}
function apRecovery(p){let score=0;const sleep=parseFloat(p.sleepHours)||0;if(sleep>=8)score+=2;else if(sleep>=7)score+=1;if(p.stress==='low')score+=2;else if(p.stress==='moderate')score+=1;if(p.occupation==='sedentary')score+=1;else if(p.occupation==='active')score-=1;const ar=p.activeRecovery;if(ar){const days=ar.daysPerWeek||0;const zones=ar.zones||[];const hasHighIntensity=zones.some(z=>z==='z4'||z==='z5');const hasGreyZone=zones.includes('z3');const hasLowZone=zones.some(z=>z==='z1'||z==='z2');if(hasLowZone&&!hasHighIntensity)score+=1;if(hasHighIntensity&&days>=3)score-=2;else if(hasHighIntensity)score-=1;if(hasGreyZone&&days>=4)score-=1;if(ar.timing==='after')score-=1;}
if(score>=4)return{label:'Optimal',colour:'var(--green)'};if(score>=2)return{label:'Moderate',colour:'#f59e0b'};return{label:'Compromised',colour:'var(--accent)'};}

const REC_MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];function recDateRowHtml(){const now=new Date();const d=String(now.getDate()).padStart(2,'0');const m=String(now.getMonth()+1).padStart(2,'0');const y=String(now.getFullYear());return`<div class="rec-date-row"><input type="hidden" id="rec-day"   value="${d}"><input type="hidden" id="rec-month" value="${m}"><input type="hidden" id="rec-year"  value="${y}"><button type="button" class="rec-date-btn" id="rdb-day"   onclick="recDatePick('day')"><span class="rec-date-btn-val">${d}</span><span class="rec-date-btn-sub">Day</span></button><button type="button" class="rec-date-btn" id="rdb-month" onclick="recDatePick('month')"><span class="rec-date-btn-val">${REC_MONTHS[now.getMonth()]}</span><span class="rec-date-btn-sub">Month</span></button><button type="button" class="rec-date-btn" id="rdb-year"  onclick="recDatePick('year')"><span class="rec-date-btn-val">${y}</span><span class="rec-date-btn-sub">Year</span></button></div>`;}
function recGetDate(){const d=document.getElementById('rec-day')?.value;const m=document.getElementById('rec-month')?.value;const y=document.getElementById('rec-year')?.value;return(d&&m&&y)?`${y}-${m}-${d}`:today();}
function recDatePick(part){const now=new Date();const yr=now.getFullYear();let items=[];if(part==='day')items=Array.from({length:31},(_,i)=>({val:String(i+1).padStart(2,'0'),label:String(i+1).padStart(2,'0')}));if(part==='month')items=REC_MONTHS.map((m,i)=>({val:String(i+1).padStart(2,'0'),label:m}));if(part==='year')items=[yr-2,yr-1,yr,yr+1].map(y=>({val:String(y),label:String(y)}));const cur=document.getElementById(`rec-${part}`)?.value||'';const title=part.charAt(0).toUpperCase()+part.slice(1);const list=items.map(it=>`<div class="rec-pick-item${it.val===cur?' selected':''}" onclick="recDateSet('${part}','${it.val}','${it.label}')">${it.label}</div>`).join('');const ov=document.createElement('div');ov.className='rec-pick-overlay';ov.id='rec-pick-ov';ov.innerHTML=`<div class="rec-pick-sheet"><div class="rec-pick-header"><span class="rec-pick-title">${title}</span><button class="rec-pick-done" onclick="document.getElementById('rec-pick-ov').remove()">Done</button></div><div class="rec-pick-list">${list}</div></div>`;ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});document.body.appendChild(ov);setTimeout(()=>{const sel=ov.querySelector('.rec-pick-item.selected');if(sel)sel.scrollIntoView({block:'center'});},50);}
function recDateSet(part,val,label){const hidden=document.getElementById(`rec-${part}`);const btn=document.getElementById(`rdb-${part}`);if(hidden)hidden.value=val;if(btn)btn.querySelector('.rec-date-btn-val').textContent=label;document.getElementById('rec-pick-ov')?.remove();}
window._recUI=window._recUI||{collapsed:true,activity:null,zone:null,timeOfDay:null,month:null};const _REC_DB='hd-photos';const _REC_STORE='photos';function _recPhotoDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open(_REC_DB,1);req.onupgradeneeded=e=>e.target.result.createObjectStore(_REC_STORE);req.onsuccess=e=>resolve(e.target.result);req.onerror=e=>reject(e.target.error);});}
async function recSavePhoto(id,dataUrl){const db=await _recPhotoDb();return new Promise((resolve,reject)=>{const tx=db.transaction(_REC_STORE,'readwrite');tx.objectStore(_REC_STORE).put(dataUrl,id);tx.oncomplete=resolve;tx.onerror=e=>reject(e.target.error);});}

customWks=customWks.filter(w=>w.id!==_cwFormId);saveCustomWks();closeCustomWkForm();renderHome();if(cur==='settings')renderSettings();toast('Workout deleted',false);}
function closeCustomWkForm(){_cwDragCleanup();document.getElementById('custom-form-overlay')?.remove();}
function closeWkModAnalysis(){document.getElementById('wkmod-analysis-overlay')?.remove();}
function showWkModAnalysis(type){const key=localStorage.getItem('hd_claude_key');if(!key)return;const original=WK[type];const modified=wkMods[type]||original.exs;const cached=wkModAnalysis[type];let el=document.getElementById('wkmod-analysis-overlay');if(!el){el=document.createElement('div');el.id='wkmod-analysis-overlay';el.className='wkmod-analysis-overlay';document.body.appendChild(el);}
const bodyId='wkmod-analysis-body';const textId='wkmod-analysis-text';const closeX=`<button onclick="closeWkModAnalysis()" style="background:none;border:none;color:var(--text-3);cursor:pointer;padding:4px;line-height:0">${SVG.x}</button>`;el.innerHTML=`
    <div class="wkmod-analysis-sheet"><div class="wkmod-analysis-head"><div><div class="wkmod-analysis-title">Mentzer's Verdict</div><div class="wkmod-analysis-subtitle">${original.label}</div></div>${closeX}
      </div><div class="wkmod-analysis-body" id="${bodyId}">${cached
          ? `<div class="wkmod-analysis-text"id="${textId}">${_renderAnalysisMarkdown(cached)}</div>`
          : `<div class="wkmod-analysis-loading"id="${textId}"><div class="wkmod-analysis-loading-dot"></div><div class="wkmod-analysis-loading-dot"></div><div class="wkmod-analysis-loading-dot"></div><span>Analysing with Claude…</span></div>`}
      </div><div class="wkmod-analysis-footer"><button class="btn-save" style="margin:0;width:100%" onclick="closeWkModAnalysis()">Got it</button>${cached ? `<div class="wkmod-analysis-warn">Tap the AI chip on the workout row to re-analyse</div>` : ''}
      </div></div>`;if(!cached)_streamWkModAnalysis(type,key,original,modified,textId);}
function _renderAnalysisMarkdown(text){return text.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/^#{1,3}\s+(.+)$/gm,'<strong style="font-size:13px;color:var(--text);display:block;margin:12px 0 4px">$1</strong>').replace(/^[-•]\s+(.+)$/gm,'<span style="display:block;padding-left:14px;position:relative"><span style="position:absolute;left:0">•</span>$1</span>').replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');}
async function _streamWkModAnalysis(type,key,original,modified,textId){const removed=original.exs.filter(e=>!modified.includes(e));const added=modified.filter(e=>!original.exs.includes(e));const kept=original.exs.filter(e=>modified.includes(e));const changeDesc=[kept.length?`Kept: ${kept.join(', ')}`:'',removed.length?`Removed: ${removed.join(', ')}`:'',added.length?`Added: ${added.join(', ')}`:'',].filter(Boolean).join('\n');const prompt=`A user has modified their ${original.label} workout from Mike Mentzer's Heavy Duty programme.

**Original Mentzer prescription:**
${original.exs.join(', ')}

**User's modified version:**
${modified.join(', ')}

**Changes made:**
${changeDesc}

Analyse this modification under Mike Mentzer's Heavy Duty / HIT principles. Be direct, specific, and honest — if they've made sound changes that align with HIT principles, validate them. If they've deviated (too much volume, poor sequencing, conflicting muscle groups, isolation before compound, etc.), call it out clearly and explain why. Keep it under 180 words. No generic preamble.`;let fullText='';const textEl=document.getElementById(textId);try{const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true','content-type':'application/json','anthropic-beta':'prompt-caching-2024-07-31',},body:JSON.stringify({model:'claude-opus-4-8',max_tokens:700,stream:true,messages:[{role:'user',content:prompt}],}),});if(!res.ok)throw new Error(`API error ${res.status}`);const reader=res.body.getReader();const dec=new TextDecoder();let buf='';while(true){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();for(const line of lines){if(!line.startsWith('data: '))continue;try{const d=JSON.parse(line.slice(6));if(d.type==='content_block_delta'&&d.delta?.type==='text_delta'){fullText+=d.delta.text;if(textEl){if(textEl.className!=='wkmod-analysis-text'){textEl.className='wkmod-analysis-text';}
textEl.innerHTML=_renderAnalysisMarkdown(fullText);}}}catch{}}}
if(fullText){wkModAnalysis[type]=fullText;saveWkModAnalysis();renderHome();}}catch(err){if(textEl)textEl.innerHTML=`<span style="color:var(--accent)">Analysis failed — check your API key in Settings.</span>`;}}
document.addEventListener('focusin',e=>{if(e.target.readOnly)setTimeout(()=>{e.target.readOnly=false;},0);},true);document.addEventListener('animationstart',e=>{if(e.animationName==='af-detect')setTimeout(()=>{e.target.value='';},0);},true);let _npId=null;function openNumPad(id,label,mode){_npId=id;document.getElementById('np-lbl').textContent=label;const inp=document.getElementById('np-input');inp.setAttribute('inputmode',mode||'decimal');inp.textContent=document.getElementById(id).value||'';document.getElementById('np-bg').classList.add('show');document.getElementById('np-sheet').classList.add('show');setTimeout(()=>{inp.focus();const sel=window.getSelection();const r=document.createRange();r.selectNodeContents(inp);r.collapse(false);sel.removeAllRanges();sel.addRange(r);},300);}function closeNumPad(){document.getElementById('np-bg').classList.remove('show');document.getElementById('np-sheet').classList.remove('show');_npId=null;}function confirmNumPad(){if(!_npId)return;const val=(document.getElementById('np-input').textContent||'').trim();document.getElementById(_npId).value=val;const disp=document.getElementById(_npId+'-disp');if(disp)disp.innerHTML=val||'<span class="nt-ph">—</span>';closeNumPad();}document.getElementById('np-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();confirmNumPad();}});load();loadCustomWks();loadWkMods();loadWkModAnalysis();loadRecovery();recMigratePhotos();renderHome();history.replaceState({screen:'home',opts:{},root:true},'');if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js');}
let _installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_installPrompt=e;document.querySelectorAll('.install-app-row').forEach(el=>el.style.display='flex');});window.addEventListener('appinstalled',()=>{_installPrompt=null;});async function promptInstall(){if(!_installPrompt)return;_installPrompt.prompt();const{outcome}=await _installPrompt.userChoice;if(outcome==='accepted')_installPrompt=null;}</script>
