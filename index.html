}

function apStartEdit()  { window._apEditing = true;  renderInsights(); }
function apCancelEdit() { window._apEditing = false; renderInsights(); }

function apChipToggle(btn) { btn.classList.toggle('on'); }
function apChipSingle(btn, groupId) {
  document.querySelectorAll(`#${groupId} .ap-chip`).forEach(c => c.classList.remove('on'));
  btn.classList.add('on');
}

function apSave() {
  const chips = id => [...document.querySelectorAll(`#${id} .ap-chip.on`)].map(c => c.dataset.val);
  const single = id => { const c = document.querySelector(`#${id} .ap-chip.on`); return c ? c.dataset.val : ''; };
  const arActivities = chips('ap-ar-act');
  const arPurpose    = chips('ap-ar-purpose');
  const arZones      = chips('ap-ar-zone');
  const arDur        = parseInt(document.getElementById('ap-ar-dur')?.value)  || null;
  const arDays       = parseInt(document.getElementById('ap-ar-days')?.value) || null;
  const arTiming     = single('ap-ar-timing');
  const arNotes      = document.getElementById('ap-ar-notes')?.value.trim() || '';
  const hasAR        = arActivities.length || arDur || arDays || arZones.length;

  const p = {
    age:             parseInt(document.getElementById('ap-age')?.value)   || null,
    yearsTraining:   parseInt(document.getElementById('ap-yrs')?.value)   || null,
    yearsHighVolume: parseInt(document.getElementById('ap-hvyrs')?.value) || 0,
    prevStyles:      chips('ap-styles'),
    goal:            single('ap-goal'),
    sleepHours:      parseFloat(document.getElementById('ap-sleep')?.value) || null,
    stress:          single('ap-stress'),
    occupation:      single('ap-occ'),
    activeRecovery:  hasAR ? { activities: arActivities, purpose: arPurpose, zones: arZones, durationMins: arDur, daysPerWeek: arDays, timing: arTiming, notes: arNotes } : null,
    injuries:        document.getElementById('ap-injuries')?.value.trim() || '',
    savedAt:         new Date().toISOString().slice(0,10)
  };
  localStorage.setItem('hd_profile', JSON.stringify(p));
  window._apEditing = false;
  renderInsights();
  toast('Profile saved', false);
}

function aiSetPrompt(text) {
  const ta = document.getElementById('ai-prompt');
  if (ta) { ta.value = text; ta.focus(); }
}

// ── AI debug log (session-scoped, survives screen re-renders) ──
window._aiLog    = window._aiLog    || [];
window._aiTapCnt = window._aiTapCnt || 0;
window._aiTapTimer = null;

function aiTitleTap() {
  window._aiTapCnt++;
  clearTimeout(window._aiTapTimer);
  window._aiTapTimer = setTimeout(() => { window._aiTapCnt = 0; }, 800);
  if (window._aiTapCnt >= 5) {
    window._aiTapCnt = 0;
    aiToggleLog();
  }
}

function aiLogPush(entry) {
  window._aiLog.unshift({ ts: new Date().toISOString(), ...entry });
  if (window._aiLog.length > 20) window._aiLog.length = 20;
  // refresh log panel if it's open
  const panel = document.getElementById('ai-log-panel');
  if (panel && panel.style.display !== 'none') aiRenderLog();
}

function aiToggleLog() {
  const panel = document.getElementById('ai-log-panel');
  if (!panel) return;
  const open = panel.style.display !== 'none';
  panel.style.display = open ? 'none' : 'block';
  if (!open) aiRenderLog();
}

function aiDebugState() {
  const lsSize = Object.keys(localStorage).reduce((acc, k) => acc + (localStorage.getItem(k)||'').length, 0);
  const profile = getProfile();
  const lastRec = recoveryLogs.length ? recoveryLogs[recoveryLogs.length - 1] : null;
  const rows = [
    ['Workouts', workouts.length],
    ['Recovery logs', recoveryLogs.length],
    ['Profile saved', profile ? profile.savedAt || '✓' : '✗'],
    ['API key', localStorage.getItem('hd_claude_key') ? '✓ present' : '✗ missing'],
    ['localStorage', (lsSize / 1024).toFixed(1) + ' KB'],
    ['SW cache', 'heavy-duty-v10'],
  ];
  if (lastRec) {
    rows.push(['Last recovery', lastRec.date + ' · ' + (lastRec.analysis?.activity || lastRec.note || '—')]);
    rows.push(['Last rec AI', lastRec.analysis ? (lastRec.analysis.zone || '—') : 'no analysis']);
  }
  return rows.map(([k,v]) => `<div style="display:flex;justify-content:space-between;padding:7px 14px;border-bottom:1px solid var(--border);font-size:11px;font-family:monospace">
    <span style="color:var(--text-3)">${k}</span><span style="color:var(--text)">${v}</span></div>`).join('');
}

window._aiDebugTab = window._aiDebugTab || 'log';

function aiRenderLog() {
  const panel = document.getElementById('ai-log-panel');
  if (!panel) return;
  const tab = window._aiDebugTab;
  const tabBtn = (id, label) => `<button onclick="window._aiDebugTab='${id}';aiRenderLog()" style="flex:1;padding:7px;font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;background:${tab===id?'var(--surface-3)':'transparent'};border:none;border-bottom:2px solid ${tab===id?'var(--accent)':'transparent'};color:${tab===id?'var(--text)':'var(--text-3)'};cursor:pointer">${label}</button>`;
  const tabs = `<div style="display:flex;border-bottom:1px solid var(--border)">${tabBtn('log','API Log')}${tabBtn('state','State')}</div>`;

  if (tab === 'state') {
    panel.innerHTML = tabs + aiDebugState();
    return;
  }

  const entries = !window._aiLog.length
    ? '<div style="padding:12px 16px;font-size:12px;color:var(--text-3)">No API calls yet.</div>'
    : window._aiLog.map(e => {
        const ok     = e.status >= 200 && e.status < 300;
        const colour = ok ? 'var(--green)' : 'var(--accent)';
        const badge  = e.source === 'recovery' ? '<span style="font-size:9px;background:#1a4a2e;color:#4ade80;padding:1px 5px;border-radius:2px;margin-right:6px;font-weight:700">REC</span>' : '<span style="font-size:9px;background:#3a1010;color:var(--accent);padding:1px 5px;border-radius:2px;margin-right:6px;font-weight:700">AI</span>';
        const summary = `${e.ts.slice(11,19)}  HTTP ${e.status||'—'}  ${e.durationMs ? e.durationMs+'ms' : ''}`;
        const detail  = JSON.stringify(e, null, 2).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        return `<div style="border-bottom:1px solid var(--border);padding:10px 14px">
          <div style="font-size:11px;font-family:monospace;color:${colour};margin-bottom:4px">${badge}${summary}</div>
          ${e.error ? `<div style="font-size:12px;color:var(--accent);margin-bottom:4px">${e.error}</div>` : ''}
          ${e.activity ? `<div style="font-size:11px;color:var(--text-2);margin-bottom:4px">↳ ${e.activity}${e.zone?' · '+e.zone:''}</div>` : ''}
          <details><summary style="font-size:11px;color:var(--text-3);cursor:pointer">Raw</summary>
          <pre style="font-size:10px;color:var(--text-2);white-space:pre-wrap;word-break:break-all;margin-top:6px;max-height:200px;overflow-y:auto">${detail}</pre></details>
        </div>`;
      }).join('');

  panel.innerHTML = tabs + entries;
}

function aiFollowUp() {
  const fu = document.getElementById('ai-followup');
  if (!fu?.value?.trim()) return;
  document.getElementById('ai-prompt').value = fu.value;
  fu.value = '';
  document.getElementById('ai-followup-wrap').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
  askClaude();
}

async function askClaude() {
  const key = localStorage.getItem('hd_claude_key');
  if (!key) { toast('Add your API key in Settings', true); return; }

  const ta = document.getElementById('ai-prompt');
  const prompt = ta?.value?.trim();
  if (!prompt) { toast('Enter a question first', true); return; }

  const sendBtn = document.getElementById('ai-send-btn');
  const area    = document.getElementById('ai-response-area');

  sendBtn.disabled = true;
  sendBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.4"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>';
  area.innerHTML = '<div class="ai-response-box"><div class="ai-loading"><span></span><span></span><span></span></div></div>';

  // Build full workout context — include every field Claude needs
  const sessions = workouts.slice().sort((a,b)=>a.date<b.date?-1:1).map(w => {
    const obj = {
      date:           w.date,
      type:           w.type,
      method:         w.method || 'legacy',
      bodyweight_kg:  w.bw  || null,
      bodyfat_pct:    w.bf  || null,
      session_note:   w.note || null,
      exercises: (w.ex||[]).filter(e=>e.n).map(e => {
        const ex = {
          name:      e.n,
          weight_kg: e.w ?? null,
          reps:      e.r ?? null,
        };
        if (e.note)  ex.note  = e.note;   // technique cues, angle changes, rest-pause etc.
        if (e.belt)  ex.belt  = e.belt;
        if (e.bar)   ex.bar   = e.bar;    // trap / olympic bar
        return ex;
      })
    };
    // strip null top-level fields to keep payload lean
    if (!obj.bodyfat_pct)  delete obj.bodyfat_pct;
    if (!obj.session_note) delete obj.session_note;
    return obj;
  });

  const profile = getProfile();
  const profileSection = profile ? `
Athlete background:
- Age: ${profile.age || 'not specified'}
- Total years weight training: ${profile.yearsTraining || 'not specified'}
- Years on high-volume training: ${profile.yearsHighVolume > 0 ? profile.yearsHighVolume : 'none — came straight to HIT or no high-volume history'}
- Previous training styles: ${profile.prevStyles?.length ? profile.prevStyles.join(', ') : 'not specified'}
- Primary goal: ${profile.goal || 'not specified'}
- Average sleep: ${profile.sleepHours ? profile.sleepHours + ' hours' : 'not specified'}
- Stress level: ${profile.stress || 'not specified'}
- Occupation type: ${profile.occupation === 'sedentary' ? 'Desk job (sedentary)' : profile.occupation === 'moderate' ? 'Moderately active' : profile.occupation === 'active' ? 'Manual labour (physically demanding)' : 'not specified'}
- Injuries / limitations: ${profile.injuries || 'none reported'}
${profile.activeRecovery ? (() => {
  const ar = profile.activeRecovery;
  const zoneLabels = {'z1':'Zone 1 (very easy)','z2':'Zone 2 (conversational)','z3':'Zone 3 (grey zone)','z4':'Zone 4 (threshold)','z5':'Zone 5 (max effort)'};
  const purposeLabels = {'recovery':'aid recovery','cardio':'cardiovascular health','fatloss':'fat loss','sport':'sport/competition','mental':'stress relief'};
  const zones   = (ar.zones||[]).map(z => zoneLabels[z]||z).join(', ') || 'not specified';
  const purposes = (ar.purpose||[]).map(p => purposeLabels[p]||p).join(', ') || 'not specified';
  const timing  = {'before':'before HIT/before work','after':'after HIT/after work (same day)','separate':'separate days only','mixed':'mixed/varies'}[ar.timing] || 'not specified';
  const hasHigh = (ar.zones||[]).some(z => z==='z4'||z==='z5');
  const hasGrey = (ar.zones||[]).includes('z3');
  const hasLow  = (ar.zones||[]).some(z => z==='z1'||z==='z2');
  return `- Cardio / active recovery:
  - Activities: ${ar.activities?.join(', ') || 'not specified'}
  - Purpose: ${purposes}
  - Intensity zones: ${zones}
  - Volume: ${ar.daysPerWeek || '?'} days/week × ${ar.durationMins || '?'} mins/session
  - Timing: ${timing}${ar.notes ? '\n  - Notes: ' + ar.notes : ''}
  - Assessment guidance: ${hasLow && !hasHigh ? 'Low-zone cardio only — likely enhancing HIT recovery via improved mitochondrial density and blood flow.' : hasHigh && hasGrey ? 'Mixed zones including high-intensity and grey-zone work — assess whether this is competing with HIT recovery. High-intensity cardio (Z4/Z5) draws on the same recovery resources as HIT; grey-zone (Z3) provides neither the recovery benefit of Z1/Z2 nor a strong enough stimulus to justify the cost.' : hasHigh ? 'High-intensity cardio (Z4/Z5) present — this directly competes with HIT recovery. Flag if rest periods between strength sessions appear insufficient.' : hasGrey ? 'Grey-zone (Z3) cardio — metabolically costly without clear benefit; consider whether this is undermining recovery.' : 'Assess cardio impact on HIT recovery based on volume and timing.'}`;
})() : '- Cardio / active recovery: none reported'}

Use this background to calibrate your analysis — e.g. someone with 15 years of high-volume training will have different recovery capacity and muscle maturity than a beginner; age and occupation directly affect recovery between HIT sessions.
` : `No athlete profile has been filled in yet. Analyse based on workout data alone and note that a profile would improve accuracy.`;

  const recoveryLogs = loadRecovery();
  const recoverySection = recoveryLogs.length > 0 ? (() => {
    const entries = recoveryLogs.map(r => ({
      date: r.date,
      time: r.time || null,
      timeOfDay: r.timeOfDay || null,
      activity: r.analysis?.activity || null,
      zone: r.analysis?.zone || null,
      duration: r.analysis?.duration || null,
      observations: r.analysis?.observations || null,
      recommendation: r.analysis?.recommendation || null,
      note: r.note || null
    }));
    return `The user's active recovery log (${entries.length} sessions, newest first):
${JSON.stringify(entries, null, 1)}`;
  })() : 'No active recovery sessions logged yet.';

  const systemPrompt = `You are an expert coach specialising in Mike Mentzer's Heavy Duty high-intensity training (HIT). You are analysing a user's complete workout history and active recovery sessions.

${profileSection}

Key Heavy Duty principles to apply when analysing:
- Workouts should be brief, infrequent, and taken to absolute muscular failure
- Single working sets per exercise at maximum intensity
- Full systemic recovery between sessions is paramount — typically 7–14+ days per muscle group
- Two main workouts: Workout A (chest/back) and Workout B (legs/shoulders/arms), alternated
- The Consolidated Method is the most advanced form: A → rest → B → rest → repeat
- Progressive overload is everything: small increases in weight or reps each session confirm progress
- Overtraining is the most common mistake; more rest is almost always better than more frequency
- Someone coming from years of high-volume training will likely need longer recovery periods than the data alone suggests, as their nervous system is conditioned to higher frequency

The user's full workout log (${sessions.length} sessions, chronological):
${JSON.stringify(sessions, null, 1)}

${recoverySection}

When you respond:
- Be specific — reference actual dates, weights, and reps from their log
- Cross-reference active recovery sessions with surrounding workout dates where relevant
- Factor in their background (age, training history, lifestyle) when making recommendations
- Be honest about plateaus or warning signs
- Keep the response focused and actionable (no fluff)
- Use markdown: **bold** for key points, bullet lists for multiple items, headers for sections if needed`;

  const reqBody = {
    model: 'claude-opus-4-8',
    max_tokens: 8000,
    thinking: { type: 'adaptive' },
    stream: true,
    system: systemPrompt,
    messages: [{ role: 'user', content: prompt }]
  };

  const t0 = Date.now();
  let httpStatus = null, requestId = null;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify(reqBody)
    });

    httpStatus = res.status;
    requestId  = res.headers.get('request-id') || res.headers.get('x-request-id') || '';

    if (!res.ok) {
      const errText = await res.text();
      let msg;
      try { msg = JSON.parse(errText).error?.message || `HTTP ${res.status}`; }
      catch(e) { msg = `HTTP ${res.status}: ${errText.slice(0,200)}`; }
      aiLogPush({ status: httpStatus, requestId, durationMs: Date.now()-t0, error: msg });
      throw new Error(msg);
    }

    // Prepare streaming response box — show it immediately so user sees activity
    area.innerHTML = `<div class="ai-response-box"><div class="ai-thinking-indicator">
      <div class="ai-loading"><span></span><span></span><span></span></div>
      <span style="font-size:12px;color:var(--text-3);margin-left:8px">Thinking…</span>
    </div><div class="ai-response-text" id="ai-stream-out" style="display:none"></div></div>`;

    const streamOut  = document.getElementById('ai-stream-out');
    const thinkingEl = area.querySelector('.ai-thinking-indicator');

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let inTextBlock = false;
    let usage = {};
    let stopReason = null;
    let blockTypes = [];
    let currentBlockType = null;
    let buf = '';

    outer: while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop(); // keep incomplete last line

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6).trim();
        if (payload === '[DONE]') break outer;
        let evt;
        try { evt = JSON.parse(payload); } catch(e) { continue; }

        switch (evt.type) {
          case 'content_block_start':
            currentBlockType = evt.content_block?.type;
            blockTypes.push(currentBlockType);
            if (currentBlockType === 'text') {
              inTextBlock = true;
              thinkingEl.style.display = 'none';
              streamOut.style.display  = '';
            }
            break;
          case 'content_block_delta':
            if (inTextBlock && evt.delta?.type === 'text_delta') {
              fullText += evt.delta.text;
              streamOut.innerHTML = aiMarkdown(fullText);
            }
            break;
          case 'content_block_stop':
            if (currentBlockType === 'text') inTextBlock = false;
            currentBlockType = null;
            break;
          case 'message_delta':
            stopReason = evt.delta?.stop_reason;
            if (evt.usage) Object.assign(usage, evt.usage);
            break;
          case 'message_start':
            if (evt.message?.usage) Object.assign(usage, evt.message.usage);
            break;
        }
      }
    }

    aiLogPush({
      status: httpStatus, requestId, durationMs: Date.now()-t0,
      stop_reason: stopReason, block_types: blockTypes,
      input_tokens: usage.input_tokens, output_tokens: usage.output_tokens,
      cache_read: usage.cache_read_input_tokens,
    });

    if (!fullText) throw new Error(`No text received. stop_reason=${stopReason}, blocks=[${blockTypes.join(',')}]`);

    // Final clean render
    area.innerHTML = `<div class="ai-response-box"><div class="ai-response-text">${aiMarkdown(fullText)}</div></div>`;
    const fw = document.getElementById('ai-followup-wrap');
    if (fw) fw.style.display = '';

  } catch (err) {
    if (httpStatus === null) {
      aiLogPush({ status: 'NETWORK_ERROR', durationMs: Date.now()-t0, error: err.message });
    }
    area.innerHTML = `<div class="ai-response-box"><div class="ai-error">⚠ ${err.message.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div></div>`;
  } finally {
    sendBtn.disabled = false;
    sendBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>';
  }
}

function aiMarkdown(md) {
  // Escape HTML
  let s = md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Bold / italic
  s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g,'<em>$1</em>');
  // Headers (##, ###, #)
  s = s.replace(/^#{1,3} (.+)$/gm,'<h4>$1</h4>');
  // Lists — process line-by-line
  const lines = s.split('\n');
  const out = []; let inList = false;
  for (const line of lines) {
    const m = line.match(/^[-•*]\s+(.+)$/);
    if (m) {
      if (!inList) { out.push('<ul>'); inList = true; }
      out.push(`<li>${m[1]}</li>`);
    } else {
      if (inList) { out.push('</ul>'); inList = false; }
      out.push(line);
    }
  }
  if (inList) out.push('</ul>');
  // Paragraphs
  const joined = out.join('\n');
  const paras = joined.split(/\n{2,}/).map(p => {
    const t = p.trim();
    if (!t || t.startsWith('<h4') || t.startsWith('<ul') || t.startsWith('<li')) return t;
    return `<p>${t.replace(/\n/g,'<br>')}</p>`;
  });
  return paras.join('\n');
}

const GD_CLIENT_ID = '485160115881-567lvkbcajarokqitjbqroqrreruc9eh.apps.googleusercontent.com';
const GD_SCOPE     = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';
const GD_FILENAME  = 'HeavyDuty-backup.json';

let gdTokenClient = null;
let gdBackupTimer = null;

function gdLoad() {
  if (window.google?.accounts?.oauth2) { gdInitClient(); return; }
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = gdInitClient;
  s.onerror = () => toast('Could not load Google Sign-In', true);
  document.head.appendChild(s);
}

function gdInitClient() {
  gdTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GD_CLIENT_ID,
    scope: GD_SCOPE,
    callback: gdHandleToken,
  });
}

function gdHandleToken(resp) {
  if (resp.error) { toast('Google: ' + resp.error, true); return; }
  const expiry = Date.now() + (resp.expires_in - 120) * 1000;
  localStorage.setItem('hd_gd_token',  resp.access_token);
  localStorage.setItem('hd_gd_expiry', String(expiry));
  // Fetch email for display
  fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
    headers: { Authorization: 'Bearer ' + resp.access_token }
  }).then(r => r.json()).then(u => {
    if (u.email) localStorage.setItem('hd_gd_email', u.email);
    if (cur === 'settings') renderSettings();
    gdBackup();
  }).catch(() => {
    if (cur === 'settings') renderSettings();
    gdBackup();
  });
}

function gdConnect() {
  if (!window.google?.accounts?.oauth2) {
    gdLoad();
    // Wait for script then connect
    const wait = setInterval(() => {
      if (window.google?.accounts?.oauth2) {
        clearInterval(wait);
        gdInitClient();
        gdTokenClient.requestAccessToken({ prompt: 'select_account' });
      }
    }, 200);
  } else {
    if (!gdTokenClient) gdInitClient();
    gdTokenClient.requestAccessToken({ prompt: 'select_account' });
  }
}

function gdDisconnect() {
  const token = localStorage.getItem('hd_gd_token');
  if (token && window.google?.accounts?.oauth2) {
    google.accounts.oauth2.revoke(token, () => {});
  }
  ['hd_gd_token','hd_gd_expiry','hd_gd_email','hd_gd_file_id','hd_gd_last_backup'].forEach(k => localStorage.removeItem(k));
  if (cur === 'settings') renderSettings();
  toast('Google Drive disconnected', false);
}

function gdIsConnected() {
  return !!(localStorage.getItem('hd_gd_token') && Date.now() < parseInt(localStorage.getItem('hd_gd_expiry') || '0'));
}

function gdLastBackupStr() {
  const t = parseInt(localStorage.getItem('hd_gd_last_backup') || '0');
  if (!t) return 'Never backed up';
  const mins = Math.floor((Date.now() - t) / 60000);
  if (mins < 1)  return 'Backed up just now';
  if (mins < 60) return `Backed up ${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24)  return `Backed up ${hrs}h ago`;
  return `Backed up ${Math.floor(hrs/24)}d ago`;
}

async function gdGetValidToken() {
  const token  = localStorage.getItem('hd_gd_token');
  const expiry = parseInt(localStorage.getItem('hd_gd_expiry') || '0');
  if (token && Date.now() < expiry) return token;           // still valid
  if (!localStorage.getItem('hd_gd_email')) return null;   // never connected
  if (!window.google?.accounts?.oauth2) return null;        // GIS not loaded
  if (!gdTokenClient) gdInitClient();
  // Silent refresh — no UI shown; resolves null if session expired
  return new Promise(resolve => {
    const prev = gdTokenClient.callback;
    gdTokenClient.callback = resp => {
      gdTokenClient.callback = prev;
      if (resp.error || !resp.access_token) { resolve(null); return; }
      const exp = Date.now() + (resp.expires_in - 120) * 1000;
      localStorage.setItem('hd_gd_token',  resp.access_token);
      localStorage.setItem('hd_gd_expiry', String(exp));
      resolve(resp.access_token);
    };
    gdTokenClient.requestAccessToken({ prompt: '' });
  });
}

async function gdBackup() {
  const token = await gdGetValidToken();
  if (!token) {
    if (localStorage.getItem('hd_gd_email')) {
      toast('Drive session expired — tap Connect to re-authenticate', true);
      // Clear stale token so settings shows reconnect option
      localStorage.removeItem('hd_gd_token');
      localStorage.removeItem('hd_gd_expiry');
      localStorage.removeItem('hd_gd_email');
      if (cur === 'settings') renderSettings();
    }
    return;
  }

  const body = JSON.stringify({ version: 2, exportedAt: new Date().toISOString(), profile: getProfile() || {}, workouts, recoveryLogs }, null, 2);
  let fileId = localStorage.getItem('hd_gd_file_id');

  try {
    // First time: search Drive for an existing file
    if (!fileId) {
      const res = await fetch(
        `https://www.googleapis.com/drive/v3/files?q=name%3D'${GD_FILENAME}'+and+trashed%3Dfalse&fields=files(id)`,
        { headers: { Authorization: 'Bearer ' + token } }
      );
      const json = await res.json();
      if (json.files?.length) fileId = json.files[0].id;
    }

    const meta = JSON.stringify({ name: GD_FILENAME, mimeType: 'application/json' });
    const form = new FormData();
    form.append('metadata', new Blob([meta], { type: 'application/json' }));
    form.append('file',     new Blob([body], { type: 'application/json' }));

    const url    = fileId
      ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
      : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    const method = fileId ? 'PATCH' : 'POST';

    const resp = await fetch(url, { method, headers: { Authorization: 'Bearer ' + token }, body: form });
    if (!resp.ok) throw new Error(await resp.text());

    const file = await resp.json();
    localStorage.setItem('hd_gd_file_id',      file.id);
    localStorage.setItem('hd_gd_last_backup',   String(Date.now()));
    toast('Backed up to Google Drive ✓', false);
    if (cur === 'settings') renderSettings();
  } catch (e) {
    console.error('Drive backup failed', e);
  }
}

function gdScheduleBackup() {
  clearTimeout(gdBackupTimer);
  gdBackupTimer = setTimeout(() => { if (gdIsConnected()) gdBackup(); }, 4000);
}

let calMonth, calYear;
const CAL_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function showCalendar(dateStr) {
  const d = dateStr ? localMidnight(dateStr) : new Date();
  calMonth = d.getMonth();
  calYear  = d.getFullYear();
  renderCalendar();
  document.getElementById('cal-bg').classList.add('show');

}

  const el = document.getElementById('cal-sheet');

// ── Calendar drag-to-dismiss ───────────────────────────
(function() {
  let startY = 0, curY = 0, dragging = false;

  function onStart(e) {
    const sheet = document.getElementById('cal-sheet');
    if (!sheet.classList.contains('show')) return;
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    curY = 0;
    dragging = true;
    sheet.classList.add('dragging');
  }

  function onMove(e) {
    if (!dragging) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    curY = Math.max(0, y - startY); // only allow downward drag
    document.getElementById('cal-sheet').style.transform = `translateY(${curY}px)`;
  }

  function onEnd() {
    if (!dragging) return;
    dragging = false;
    const sheet = document.getElementById('cal-sheet');
    sheet.classList.remove('dragging');
    if (curY > 80) {
      hideCalendar();
    } else {
      sheet.style.transform = '';
    }
  }

  document.addEventListener('touchstart', e => {
    if (e.target.closest('#cal-sheet')) onStart(e);
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (dragging) onMove(e);
  }, { passive: true });
  document.addEventListener('touchend', onEnd);
})();

function calNav(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0)  { calMonth = 11; calYear--; }
  renderCalendar();
}

function renderCalendar() {
  const todayStr = today();
  const byDate = {};
  workouts.forEach(w => { byDate[w.date] = w; });

  const firstDow = new Date(calYear, calMonth, 1).getDay(); // 0=Sun
  const startOffset = (firstDow + 6) % 7; // shift to Mon=0
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

  let cells = '';
  for (let i = 0; i < startOffset; i++) cells += `<div class="cal-cell"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = ds === todayStr;
    const w = byDate[ds];
    let cls = 'cal-cell cal-day';
    if (isToday)  cls += ' cal-today';
    if (w)        cls += ' cal-workout';
    const tap = w ? `onclick="hideCalendar();go('detail',{id:'${w.id}'})"` : '';
    cells += `<div class="${cls}" ${tap}><span>${d}</span>${w?'<div class="cal-workout-dot"></div>':''}</div>`;
  }

  document.getElementById('cal-body').innerHTML = `
    <div class="cal-header">
      <button class="cal-nav" onclick="calNav(-1)"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <div class="cal-month-label">${CAL_MONTHS[calMonth]} ${calYear}</div>
      <button class="cal-nav" onclick="calNav(1)"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
    <div class="cal-dow"><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div></div>
    <div class="cal-grid">${cells}</div>
  `;
}

function renderGuide() {
  const exCards = EXERCISES.map(ex => {
    const programPills = ex.program.map(p=>`<span class="guide-prog-pill">${p}</span>`).join('');
    const cuesList = ex.cues.map(c=>`<li>${c}</li>`).join('');
    return `
    <div class="guide-card">
      <div class="guide-card-head">
        <div class="guide-ex-name">${ex.name}</div>
        <div class="guide-muscles">${ex.muscles}</div>
        <div class="guide-pills">${programPills}</div>
      </div>
      <div class="guide-card-body">
        <div class="guide-quote">"${ex.mentzer}"</div>
        <ul class="guide-cues">${cuesList}</ul>
        <a class="guide-yt-link" href="${ex.yt}" target="_blank" rel="noopener">${ytSvg} Watch on Heavy Duty College</a>
      </div>
    </div>`;
  }).join('');

  const techCards = TECHNIQUES.map(t => {
    const steps = t.howto.map(s=>`<li>${s}</li>`).join('');
    return `
    <div class="guide-card guide-card-tech">
      <div class="guide-card-head">
        <div class="guide-ex-name">${t.name}</div>
        <div class="guide-tech-tag">${t.tag}</div>
      </div>
      <div class="guide-card-body">
        <div class="guide-quote">"${t.mentzer}"</div>
        <ul class="guide-cues">${steps}</ul>
        <div class="guide-warning">⚠ ${t.warning}</div>
        <a class="guide-yt-link" href="${t.yt}" target="_blank" rel="noopener">${ytSvg} Watch on Heavy Duty College</a>
      </div>
    </div>`;
  }).join('');

  document.getElementById('s-guide').innerHTML = `
    <div class="page-top">
      <div class="page-title">Exercise Guide</div>
      <div class="page-subtitle">Brief · Brutal · Basic. Train to failure. Then rest. That's it.</div>
    </div>
    <div class="guide-hero-img-wrap">
      <img src="mike-mentzer-doing-barbell-curls-2000511149.jpg" alt="Mike Mentzer training" class="guide-hero-img">
      <div class="guide-hero-fade"></div>
    </div>
    <div class="sec"><div class="sec-label">Exercises</div></div>
    ${exCards}
    <div class="sec" style="margin-top:16px"><div class="sec-label">Advanced Techniques</div></div>
    ${techCards}
    <div class="gap"></div>
  `;
}

load();
loadRecovery();
renderHome();
history.replaceState({ screen: 'home', opts: {} }, '');


if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}

let _installPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _installPrompt = e;
  document.querySelectorAll('.install-app-row').forEach(el => el.style.display = 'flex');
});
window.addEventListener('appinstalled', () => { _installPrompt = null; });

async function promptInstall() {
  if (!_installPrompt) return;
  _installPrompt.prompt();
  const { outcome } = await _installPrompt.userChoice;
  if (outcome === 'accepted') _installPrompt = null;
}
</script>
