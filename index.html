async function exportData() {
  try {
    const profile = getProfile();
    const photos  = await recGetAllPhotos();
    const backup  = { version: 3, exportedAt: new Date().toISOString(), profile: profile || {}, workouts, recoveryLogs, photos };
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `HIT-log-${today()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Backup exported!', false);
  } catch(err) {
    toast('Export failed: ' + err.message, true);
  }
}

function handleImport(evt) {
  const file = evt.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const raw = JSON.parse(e.target.result);
      // Support both old format (bare array) and new format ({version, workouts, profile})
      const sessions = Array.isArray(raw) ? raw : raw.workouts;
      const profile  = Array.isArray(raw) ? null : (raw.profile || null);
      if (!Array.isArray(sessions)) throw 0;
      showSheet(
        'Replace all data?',
        `This will overwrite your ${workouts.length} existing sessions with the ${sessions.length} sessions in the file. This cannot be undone.`,
        'Replace Data',
        () => {
          workouts = sessions.map(w => normaliseBar(normaliseBelt(normaliseNames({
            ...w,
            method: w.method || (ROT.includes(w.type) ? 'consolidated' : 'legacy')
          }))));
          save();
          if (profile && Object.keys(profile).length) {
            localStorage.setItem('hd_profile', JSON.stringify(profile));
          }
          if (Array.isArray(raw.recoveryLogs)) {
            recoveryLogs = raw.recoveryLogs;
            saveRecovery();
          }
          if (raw.photos && typeof raw.photos === 'object') {
            Object.entries(raw.photos).forEach(([id, dataUrl]) => recSavePhoto(id, dataUrl));
          }
          toast(`Loaded ${sessions.length} sessions`, false);
          go('home');
        }
      );
    } catch { toast('Invalid JSON file', true); }
  };
  r.readAsText(file); evt.target.value='';
}

function confirmDelete(id) {
  showSheet('Delete this workout?', 'This action cannot be undone.', 'Delete', () => {
    workouts = workouts.filter(w=>w.id!==id);
    save(); hideSheet(); toast('Workout deleted', false); go('history');
  });
}

function getProfile() {

function apRecovery(p) {
  let score = 0;
  const sleep = parseFloat(p.sleepHours) || 0;
  if (sleep >= 8) score += 2; else if (sleep >= 7) score += 1;
  if (p.stress === 'low') score += 2; else if (p.stress === 'moderate') score += 1;
  if (p.occupation === 'sedentary') score += 1; else if (p.occupation === 'active') score -= 1;
  const ar = p.activeRecovery;
  if (ar) {
    const days  = ar.daysPerWeek || 0;
    const zones = ar.zones || [];
    const hasHighIntensity = zones.some(z => z === 'z4' || z === 'z5');
    const hasGreyZone      = zones.includes('z3');
    const hasLowZone       = zones.some(z => z === 'z1' || z === 'z2');
    if (hasLowZone && !hasHighIntensity) score += 1;
    if (hasHighIntensity && days >= 3) score -= 2;
    else if (hasHighIntensity) score -= 1;
    if (hasGreyZone && days >= 4) score -= 1;
    if (ar.timing === 'after') score -= 1;
  }
  if (score >= 4) return { label: 'Optimal',     colour: 'var(--green)' };
  if (score >= 2) return { label: 'Moderate',    colour: '#f59e0b' };
  return              { label: 'Compromised', colour: 'var(--accent)' };
}

function recDatePick(part) {
  const now = new Date();
  const yr  = now.getFullYear();
  let items = [];
  if (part === 'day')   items = Array.from({length:31},(_,i)=>({ val: String(i+1).padStart(2,'0'), label: String(i+1).padStart(2,'0') }));
  if (part === 'month') items = REC_MONTHS.map((m,i)=>({ val: String(i+1).padStart(2,'0'), label: m }));
  if (part === 'year')  items = [yr-2,yr-1,yr,yr+1].map(y=>({ val: String(y), label: String(y) }));

    const sel = ov.querySelector('.rec-pick-item.selected');
    if (sel) sel.scrollIntoView({ block: 'center' });

function recDateSet(part, val, label) {

// ── IndexedDB photo store ─────────────────────────────
const _REC_DB    = 'hd-photos';
const _REC_STORE = 'photos';

function _recPhotoDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(_REC_DB, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(_REC_STORE);
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
}
async function recSavePhoto(id, dataUrl) {
  const db = await _recPhotoDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(_REC_STORE, 'readwrite');
    tx.objectStore(_REC_STORE).put(dataUrl, id);
    tx.oncomplete = resolve;
    tx.onerror    = e => reject(e.target.error);
  });
}
async function recLoadPhoto(id) {
  const db = await _recPhotoDb();
  return new Promise(resolve => {
    const req = db.transaction(_REC_STORE).objectStore(_REC_STORE).get(id);
    req.onsuccess = e => resolve(e.target.result || null);
    req.onerror   = () => resolve(null);
  });
}
async function recDeletePhoto(id) {
  const db = await _recPhotoDb();
  return new Promise(resolve => {
    const tx = db.transaction(_REC_STORE, 'readwrite');
    tx.objectStore(_REC_STORE).delete(id);
    tx.oncomplete = resolve;
    tx.onerror    = resolve;
  });
}
async function recGetAllPhotos() {
  const db = await _recPhotoDb();
  return new Promise(resolve => {
    const out = {};
    const req = db.transaction(_REC_STORE).objectStore(_REC_STORE).openCursor();
    req.onsuccess = e => {
      const c = e.target.result;
      if (c) { out[c.key] = c.value; c.continue(); } else resolve(out);
    };
    req.onerror = () => resolve({});
  });
}
async function recMigratePhotos() {
  const toMigrate = recoveryLogs.filter(r => r.thumb);
  if (!toMigrate.length) return;
  const total = toMigrate.length;
  toast(`Upgrading photo storage… 0 / ${total}`, false, 0);
  let done = 0;
  for (const r of toMigrate) {
    await recSavePhoto(r.id, r.thumb);
    delete r.thumb;
    r.hasPhoto = true;
    done++;
    if (done % 5 === 0 || done === total) {
      toast(`Upgrading photo storage… ${done} / ${total}`, false, 0);
    }
  }
  saveRecovery();
  toast(`Photo storage upgraded (${total} sessions)`, false);
}
async function recFillPhotos() {
  const imgs = document.querySelectorAll('img[id^="rec-img-"]');
  for (const img of imgs) {
    if (img.src && img.src !== window.location.href) continue;
    const id = img.id.slice(8);
    const dataUrl = await recLoadPhoto(id);
    if (dataUrl && img.isConnected) img.src = dataUrl;
  }
}

// ── Image fingerprinting ──────────────────────────────
async function recFingerprint(buf) {
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).slice(0, 8).map(b => b.toString(16).padStart(2,'0')).join('');
}
function recDuplicateId(fp) {
  if (!fp) return null;
  return recoveryLogs.find(r => r.fingerprint === fp)?.id || null;
}

// ── EXIF date extraction ──────────────────────────────
function extractExifDate(buffer) {
  const v = new DataView(buffer);
  if (v.getUint16(0) !== 0xFFD8) return null;
  let off = 2;
  while (off < buffer.byteLength - 4) {
    const marker = v.getUint16(off);
    if (marker === 0xFFDA) break;
    const segLen = v.getUint16(off + 2);
    if (marker === 0xFFE1 && segLen > 6) {
      const hdr = String.fromCharCode(...new Uint8Array(buffer, off + 4, 4));
      if (hdr === 'Exif') {
        const t = off + 10;
        const le = v.getUint16(t) === 0x4949;
        const u16 = o => v.getUint16(o, le);
        const u32 = o => v.getUint32(o, le);
        const readStr = (o, len) => { try { let s=''; for(let i=0;i<len;i++){ const c=v.getUint8(o+i); if(!c) break; s+=String.fromCharCode(c); } return s; } catch(e){return null;} };

        // Scan a single IFD level; returns map of tag->value
        const readIfd = ifd => {
          const tags = {};
          try {
            const n = u16(ifd);
            for (let i = 0; i < n; i++) {
              const e = ifd + 2 + i * 12;
              tags[u16(e)] = u32(e + 8); // store value/offset for each tag
            }
          } catch(e) {}
          return tags;
        };

        // Priority: ExifIFD DateTimeOriginal (0x9003) > ExifIFD DateTimeDigitized (0x9004)
        //           > IFD0 DateTimeOriginal (0x9003) > IFD0 DateTime (0x0132)
        const ifd0Tags  = readIfd(t + u32(t + 4));
        let result = null;

        // Check ExifIFD first (tag 0x8769 in IFD0 points to it)
        if (ifd0Tags[0x8769] !== undefined) {
          const exifTags = readIfd(t + ifd0Tags[0x8769]);
          if (exifTags[0x9003] !== undefined) result = readStr(t + exifTags[0x9003], 19);
          if (!result && exifTags[0x9004] !== undefined) result = readStr(t + exifTags[0x9004], 19);
        }
        // Fall back to IFD0 tags
        if (!result && ifd0Tags[0x9003] !== undefined) result = readStr(t + ifd0Tags[0x9003], 19);
        if (!result && ifd0Tags[0x0132] !== undefined) result = readStr(t + ifd0Tags[0x0132], 19);
        if (result) return result;
      }
    }
    off += 2 + segLen;
  }
  return null;
}

function parseExifDate(raw) {
  if (!raw) return null;
  const m = raw.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2})/);
  if (!m) return null;
  return { date: `${m[1]}-${m[2]}-${m[3]}`, time: `${m[4]}:${m[5]}`, hour: parseInt(m[4]) };
}

function getTimeOfDay(hour) {
  if (hour === null || hour === undefined) return null;
  if (hour < 6)  return 'Night';
  if (hour < 12) return 'Morning';
  if (hour < 17) return 'Afternoon';
  if (hour < 21) return 'Evening';
  return 'Night';
}

// ── Bulk import ───────────────────────────────────────
function recBulkImport() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
  inp.onchange = () => { if (inp.files.length) recProcessBulk(Array.from(inp.files)); };
  inp.click();
}

async function recProcessBulk(files) {
  const key = localStorage.getItem('hd_claude_key');
  const total = files.length;

  // Build progress sheet
  const ov = document.createElement('div');
  ov.className = 'rec-progress-overlay'; ov.id = 'rec-bulk-ov';
  ov.innerHTML = `<div class="rec-progress-sheet">
    <div class="rec-progress-title">Importing ${total} photo${total>1?'s':''}</div>
    <div class="rec-progress-sub" id="rec-bulk-sub">Starting…</div>
    <div class="rec-progress-bar-wrap"><div class="rec-progress-bar-fill" id="rec-bulk-bar" style="width:0%"></div></div>
    <div class="rec-progress-list" id="rec-bulk-list"></div>
    <button class="rec-progress-done-btn" id="rec-bulk-done" onclick="document.getElementById('rec-bulk-ov').remove();renderInsights()">Done — View sessions</button>
  </div>`;
  document.body.appendChild(ov);

  const list = document.getElementById('rec-bulk-list');
  let done = 0;

  for (const file of files) {
    done++;
    const pct = Math.round((done - 1) / total * 100);
    document.getElementById('rec-bulk-bar').style.width = pct + '%';
    document.getElementById('rec-bulk-sub').textContent = `Analysing ${done} of ${total}…`;

    // Row placeholder
    const row = document.createElement('div');
    row.className = 'rec-progress-item';
    row.innerHTML = `<div class="rec-progress-item-thumb" id="bthumb-${done}"></div>
      <div class="rec-progress-item-info">
        <div class="rec-progress-item-name">${file.name}</div>
        <div class="rec-progress-item-status" id="bstat-${done}">Resizing…</div>
      </div>`;
    list.appendChild(row);
    list.scrollTop = list.scrollHeight;

    const setStatus = s => { const el = document.getElementById(`bstat-${done}`); if (el) el.textContent = s; };

    try {
      // Read buffer for EXIF before resizing
      const buf = await file.arrayBuffer();
      const fp = await recFingerprint(buf);
      if (recDuplicateId(fp)) {
        setStatus('Already imported — skipped');
        continue;
      }
      const exif = parseExifDate(extractExifDate(buf));

      const thumb_small = await recResizeImage(file, 1600, 0.88);
      const thumb = document.getElementById(`bthumb-${done}`);
      if (thumb) { const img = document.createElement('img'); img.className='rec-progress-item-thumb'; img.src=thumb_small.dataUrl; thumb.replaceWith(img); }

      const entryDate    = exif?.date || today();
      const entryTime    = exif?.time || null;
      const entryTOD     = exif ? getTimeOfDay(exif.hour) : null;
      const entryMonth   = entryDate.slice(0, 7); // YYYY-MM

      let analysis = null;
      if (key) {
        setStatus('Analysing with Claude…');
        const api_img = await recResizeImage(file, 512, 0.82);
        const reqBody = JSON.stringify({
          model: 'claude-opus-4-8', max_tokens: 400,
          messages: [{ role: 'user', content: [
            { type: 'image', source: { type: 'base64', media_type: api_img.mediaType, data: api_img.b64 } },
            { type: 'text', text: `You are a coach for Mike Mentzer's Heavy Duty training — HIT means Heavy Duty high-intensity weight training, NOT HIIT cardio. This photo shows an ACTIVE RECOVERY session (light cardio or movement done between heavy weight training sessions to aid recovery). Analyse the photo and respond ONLY with raw JSON:\n{"activity":"e.g. Cycling","zone":"e.g. Zone 2","duration":"e.g. 30 min or null","observations":"1 sentence describing what you see","recommendation":"1 sentence on how this active recovery session supports recovery from heavy compound weight training"}` }
          ]}]
        });
        for (let attempt = 1; attempt <= 3; attempt++) {
          try {
            const res = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true' },
              body: reqBody
            });
            if (res.status === 429 || res.status === 529) {
              const wait = attempt * 8000;
              setStatus(`Rate limited — waiting ${wait/1000}s…`);
              await new Promise(r => setTimeout(r, wait));
              continue;
            }
            if (res.ok) {
              const data = await res.json();
              const raw  = (data.content||[]).find(b=>b.type==='text')?.text||'';
              const m    = raw.replace(/```[a-z]*\n?/gi,'').trim().match(/\{[\s\S]*\}/);
              if (m) analysis = JSON.parse(m[0]);
            } else {
              setStatus(`Analysis failed (HTTP ${res.status})`);
            }
            break;
          } catch(e) {
            if (attempt === 3) setStatus(`Analysis error: ${e.message}`);
          }
        }
        // Small pause between photos to respect rate limits
        await new Promise(r => setTimeout(r, 1500));
      }

      const entryId = 'r'+Date.now()+Math.random().toString(36).slice(2,5);
      await recSavePhoto(entryId, thumb_small.dataUrl);
      setStatus(analysis ? `${analysis.activity||'Saved'} · ${analysis.zone||''}` : (key ? 'Saved (analysis failed)' : 'Saved (no API key)'));
      recoveryLogs.push({
        id: entryId, fingerprint: fp,
        date: entryDate, time: entryTime, timeOfDay: entryTOD, month: entryMonth,
        hasPhoto: true, note: '', analysis, savedAt: new Date().toISOString()
      });
      saveRecovery();

    } catch(err) {
      setStatus('Failed: ' + err.message);
    }
  }

  document.getElementById('rec-bulk-bar').style.width = '100%';
  document.getElementById('rec-bulk-sub').textContent = `${total} photo${total>1?'s':''} imported`;
  const doneBtn = document.getElementById('rec-bulk-done');
  if (doneBtn) doneBtn.style.display = 'block';
  aiLogPush({ source: 'recovery', status: 200, durationMs: 0, activity: `Bulk import: ${total} photos` });
}

function recCardHtml(r) {
  const img   = (r.hasPhoto || r.thumb)
    ? `<img class="rec-thumb" id="rec-img-${r.id}" src="" alt="">`

  const dur   = r.analysis?.duration ? `<span style="font-size:11px;color:var(--text-3);margin-left:6px">${r.analysis.duration}</span>` : '';
  const obs   = r.analysis?.observations || (r.note && !r.analysis ? r.note : '');
  const time  = r.time ? ` · ${r.time}` : '';
  return `<div class="rec-card" onclick="recOpenDetail('${r.id}')" style="cursor:pointer">

    </div>
    <button class="rec-delete" onclick="event.stopPropagation();recDelete('${r.id}')" title="Delete">×</button>
  </div>`;
}

async function recReanalyseAll(onlyMissing = false) {
  const key = localStorage.getItem('hd_claude_key');
  if (!key) { toast('No API key set', true); return; }
  const targets = recoveryLogs.filter(r => (r.hasPhoto || r.thumb) && (!onlyMissing || !r.analysis));
  if (!targets.length) { toast('No sessions with photos to analyse', true); return; }
  const btn = document.getElementById('dbg-reanalyse-btn');
  if (btn) { btn.disabled = true; }
  let done = 0, failed = 0;
  const prompt = `You are a coach for Mike Mentzer's Heavy Duty training — HIT means Heavy Duty high-intensity weight training, NOT HIIT cardio. This photo shows an ACTIVE RECOVERY session (light cardio or movement done between heavy weight training sessions to aid recovery). Analyse the photo and respond ONLY with raw JSON:\n{"activity":"e.g. Cycling","zone":"e.g. Zone 2","duration":"e.g. 30 min or null","observations":"1 sentence describing what you see","recommendation":"1 sentence on how this active recovery session supports recovery from heavy compound weight training"}`;
  for (const r of targets) {
    if (btn) btn.textContent = `Analysing ${done + 1} / ${targets.length}…`;
    try {
      const dataUrl = await recLoadPhoto(r.id);
      if (!dataUrl) { failed++; continue; }
      const b64 = dataUrl.split(',')[1];
      let success = false;
      for (let attempt = 1; attempt <= 3; attempt++) {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true' },
          body: JSON.stringify({ model: 'claude-opus-4-8', max_tokens: 400, messages: [{ role: 'user', content: [{ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } }, { type: 'text', text: prompt }] }] })
        });
        if (res.status === 429 || res.status === 529) {
          if (btn) btn.textContent = `Rate limited — waiting ${attempt * 10}s…`;
          await new Promise(r => setTimeout(r, attempt * 10000));
          continue;
        }
        if (res.ok) {
          const data = await res.json();
          const raw = (data.content||[]).find(b => b.type==='text')?.text||'';
          const m = raw.replace(/```[a-z]*\n?/gi,'').trim().match(/\{[\s\S]*\}/);
          if (m) { r.analysis = JSON.parse(m[0]); success = true; }
        }
        break;
      }
      if (!success) failed++;
    } catch(e) { failed++; }
    done++;
    saveRecovery();
    await new Promise(r => setTimeout(r, 1500));
  }
  aiRenderLog();
  if (cur === 'insights') renderInsights();
  toast(`Re-analysis complete — ${done - failed} updated, ${failed} failed`, false);
  if (btn) { btn.disabled = false; btn.textContent = `Re-analyse all ${targets.length} sessions`; }
}

async function recReanalyse(id) {
  const r = recoveryLogs.find(x => x.id === id);
  if (!r) return;
  const key = localStorage.getItem('hd_claude_key');
  if (!key) { toast('No API key set', true); return; }
  const btn = document.getElementById('rec-reanalyse-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Analysing…'; }

  try {
    const dataUrl = await recLoadPhoto(id);
    if (!dataUrl) { toast('No photo found for this session', true); if (btn) { btn.disabled = false; btn.textContent = 'Re-analyse'; } return; }

    const b64 = dataUrl.split(',')[1];
    for (let attempt = 1; attempt <= 3; attempt++) {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify({
          model: 'claude-opus-4-8', max_tokens: 400,
          messages: [{ role: 'user', content: [
            { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } },
            { type: 'text', text: `You are a coach for Mike Mentzer's Heavy Duty training — HIT means Heavy Duty high-intensity weight training, NOT HIIT cardio. This photo shows an ACTIVE RECOVERY session (light cardio or movement done between heavy weight training sessions to aid recovery). Analyse the photo and respond ONLY with raw JSON:\n{"activity":"e.g. Cycling","zone":"e.g. Zone 2","duration":"e.g. 30 min or null","observations":"1 sentence describing what you see","recommendation":"1 sentence on how this active recovery session supports recovery from heavy compound weight training"}` }
          ]}]
        })
      });
      if (res.status === 429 || res.status === 529) {
        if (btn) btn.textContent = `Rate limited — retrying…`;
        await new Promise(r => setTimeout(r, attempt * 8000));
        continue;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const raw  = (data.content||[]).find(b => b.type==='text')?.text || '';
      const m    = raw.replace(/```[a-z]*\n?/gi,'').trim().match(/\{[\s\S]*\}/);
      if (!m) throw new Error('Could not parse response');
      r.analysis = JSON.parse(m[0]);
      saveRecovery();
      toast('Analysis updated', false);
      document.getElementById('rec-detail-ov')?.remove();
      recOpenDetail(id);
      return;
    }
    throw new Error('Rate limit — try again shortly');
  } catch(e) {
    toast('Analysis failed: ' + e.message, true);
    if (btn) { btn.disabled = false; btn.textContent = 'Re-analyse'; }
  }
}

function recOpenFilterSheet() {
  const ui = window._recUI;
  const sorted = [...recoveryLogs].sort((a,b) => b.date.localeCompare(a.date));
  const activities = [...new Set(sorted.map(r => r.analysis?.activity).filter(Boolean))];
  const zones      = [...new Set(sorted.map(r => r.analysis?.zone).filter(Boolean))];
  const TOD_ORDER  = ['Morning','Afternoon','Evening','Night'];
  const timesOfDay = [...new Set(sorted.map(r => r.timeOfDay).filter(Boolean))].sort((a,b) => TOD_ORDER.indexOf(a)-TOD_ORDER.indexOf(b));
  const months     = [...new Set(sorted.map(r => r.month || r.date?.slice(0,7)).filter(Boolean))].sort().reverse();
  const fmtMonth   = m => { const [y,mo] = m.split('-'); return REC_MONTHS[parseInt(mo)-1]+' '+y; };

  // Track pending selections separately so Apply commits them
  window._recPending = { activity: ui.activity, zone: ui.zone, timeOfDay: ui.timeOfDay, month: ui.month };

  const group = (label, items, key) => !items.length ? '' : `
    <div class="rec-fgroup">
      <div class="rec-fgroup-label">${label}</div>
      <div class="rec-fgroup-chips">${items.map(v => {
        const label = v instanceof Object ? v.label : v;
        const val   = v instanceof Object ? v.val   : v;
        return `<button class="rec-fchip" id="rfchip-${key}-${label.replace(/[^a-z0-9]/gi,'_')}" onclick="recPendingToggle('${key}','${val.replace(/'/g,"\\'")}',this)">${label}</button>`;
      }).join('')}</div>
    </div>`;

  const ov = document.createElement('div');
  ov.className = 'rec-overlay'; ov.id = 'rec-fov';
  ov.innerHTML = `<div class="rec-fsheet" id="rec-fsheet">
    <div class="rec-drag-handle" style="margin:12px auto 0"></div>
    <div class="rec-fsheet-head">
      <span class="rec-fsheet-title">Filter Sessions</span>
      <button class="rec-fsheet-clear" onclick="recPendingClear()">Clear all</button>
    </div>
    <div class="rec-fsheet-body">
      ${group('Activity',    activities, 'activity')}
      ${group('Zone',        zones,      'zone')}
      ${group('Time of day', timesOfDay, 'timeOfDay')}
      ${group('Month',       months.map(m => ({ toString:()=>fmtMonth(m), val:m, label:fmtMonth(m) })), 'month')}
    </div>
    <div class="rec-fsheet-footer">
      <button class="rec-fsheet-apply" onclick="recApplyFilters()">Show results</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });

  // Mark initially-active chips
  setTimeout(() => {
    if (ui.activity)  document.getElementById(`rfchip-activity-${ui.activity.replace(/[^a-z0-9]/gi,'_')}`)?.classList.add('on');
    if (ui.zone)      document.getElementById(`rfchip-zone-${ui.zone.replace(/[^a-z0-9]/gi,'_')}`)?.classList.add('on');
    if (ui.timeOfDay) document.getElementById(`rfchip-timeOfDay-${ui.timeOfDay.replace(/[^a-z0-9]/gi,'_')}`)?.classList.add('on');
    if (ui.month) {
      const mKey = months.find(m => m === ui.month);
      if (mKey) document.getElementById(`rfchip-month-${fmtMonth(mKey).replace(/[^a-z0-9]/gi,'_')}`)?.classList.add('on');
    }
  }, 0);

  // Pull-down to dismiss
  const sheet = document.getElementById('rec-fsheet');
  let dy0 = 0, drag = false;
  sheet.addEventListener('touchstart', e => { if (sheet.querySelector('.rec-fsheet-body').scrollTop > 0) return; dy0 = e.touches[0].clientY; drag = true; }, { passive: true });
  sheet.addEventListener('touchmove',  e => { if (!drag) return; const d = e.touches[0].clientY - dy0; if (d > 0) sheet.style.transform = `translateY(${d}px)`; }, { passive: true });
  sheet.addEventListener('touchend',   e => { if (!drag) return; drag = false; if (e.changedTouches[0].clientY - dy0 > 80) ov.remove(); else sheet.style.transform = ''; }, { passive: true });
}

function recPendingToggle(key, val, btn) {
  // For month chips, val is the fmtMonth label — need to reverse-map to YYYY-MM
  if (key === 'month') {
    const sorted = [...recoveryLogs].sort((a,b) => b.date.localeCompare(a.date));
    const months = [...new Set(sorted.map(r => r.month || r.date?.slice(0,7)).filter(Boolean))].sort().reverse();
    const fmtMonth = m => { const [y,mo] = m.split('-'); return REC_MONTHS[parseInt(mo)-1]+' '+y; };
    val = months.find(m => fmtMonth(m) === val) || val;
  }
  window._recPending[key] = window._recPending[key] === val ? null : val;
  // Update chip styles within the same group
  btn.closest('.rec-fgroup-chips').querySelectorAll('.rec-fchip').forEach(c => c.classList.remove('on'));
  if (window._recPending[key]) btn.classList.add('on');
}

function recPendingClear() {
  window._recPending = { activity: null, zone: null, timeOfDay: null, month: null };
  document.querySelectorAll('.rec-fchip').forEach(c => c.classList.remove('on'));
}

function recApplyFilters() {
  Object.assign(window._recUI, window._recPending);
  window._recUI.collapsed = false;
  document.getElementById('rec-fov')?.remove();
  renderInsights();
}

function recSectionHtml() {
  const ui = window._recUI;
  const sorted = [...recoveryLogs].sort((a,b) => b.date.localeCompare(a.date));

  // Build filter options from metadata
  const activities = [...new Set(sorted.map(r => r.analysis?.activity).filter(Boolean))];
  const zones      = [...new Set(sorted.map(r => r.analysis?.zone).filter(Boolean))];
  const timesOfDay = [...new Set(sorted.map(r => r.timeOfDay).filter(Boolean))];
  const TOD_ORDER  = ['Morning','Afternoon','Evening','Night'];
  timesOfDay.sort((a,b) => TOD_ORDER.indexOf(a) - TOD_ORDER.indexOf(b));
  const months     = [...new Set(sorted.map(r => r.month || r.date?.slice(0,7)).filter(Boolean))].sort().reverse();
  const fmtMonth   = m => { const [y,mo] = m.split('-'); return REC_MONTHS[parseInt(mo)-1]+' '+y; };

  // Apply filters
  let filtered = sorted;
  if (ui.activity)  filtered = filtered.filter(r => r.analysis?.activity === ui.activity);
  if (ui.zone)      filtered = filtered.filter(r => r.analysis?.zone === ui.zone);
  if (ui.timeOfDay) filtered = filtered.filter(r => r.timeOfDay === ui.timeOfDay);
  if (ui.month)     filtered = filtered.filter(r => (r.month || r.date?.slice(0,7)) === ui.month);

  const anyFilter = ui.activity || ui.zone || ui.timeOfDay || ui.month;
  const activeCount = [ui.activity, ui.zone, ui.timeOfDay, ui.month].filter(Boolean).length;
  const activeTags = [
    ui.activity  && `<span class="rec-active-tag">${ui.activity}<button onclick="recSetFilter('activity',null)">×</button></span>`,
    ui.zone      && `<span class="rec-active-tag">${ui.zone}<button onclick="recSetFilter('zone',null)">×</button></span>`,
    ui.timeOfDay && `<span class="rec-active-tag">${ui.timeOfDay}<button onclick="recSetFilter('timeOfDay',null)">×</button></span>`,
    ui.month     && `<span class="rec-active-tag">${fmtMonth(ui.month)}<button onclick="recSetFilter('month',null)">×</button></span>`,
  ].filter(Boolean).join('');

  const hasFilters = activities.length || zones.length || timesOfDay.length || months.length;
  const filterBar = hasFilters ? `<div class="rec-filter-bar">
    <button class="rec-filter-btn${anyFilter?' active':''}" onclick="recOpenFilterSheet()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
      Filter${activeCount ? '' : ''}
      ${activeCount ? `<span class="rec-filter-badge">${activeCount}</span>` : ''}
    </button>
    ${activeTags ? `<div class="rec-active-tags">${activeTags}</div>` : ''}
  </div>` : '';

  const shown   = ui.collapsed ? filtered.slice(0,1) : filtered;
  const cards   = shown.map(recCardHtml).join('');
  const hasMore = filtered.length > 1;
  const chevron = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transition:transform 0.2s;transform:rotate(${ui.collapsed?'0':'180'}deg)"><polyline points="6 9 12 15 18 9"/></svg>`;

  return `<div class="rec-section">
    <div class="rec-section-header">
      <button style="background:none;border:none;display:flex;align-items:center;gap:7px;cursor:pointer;padding:0;margin-right:12px" onclick="recToggle()">
        <span class="rec-section-title">Active Recovery${recoveryLogs.length ? ' ('+recoveryLogs.length+')' : ''}</span>
        ${recoveryLogs.length ? chevron : ''}
      </button>
      <button class="rec-bulk-btn" onclick="recBulkImport()" title="Bulk import photos" style="padding:6px 8px">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
    </div>
    <button class="rec-log-btn" onclick="recOpenSheet()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Log Recovery Session
    </button>
    ${!recoveryLogs.length ? '' : `
      ${filterBar}
      ${filtered.length ? `<div class="rec-list">${cards}</div>` : `<div class="rec-empty">No sessions match this filter.</div>`}
      ${!ui.collapsed && hasMore ? '' : ui.collapsed && hasMore ? `<button class="rec-show-more" onclick="recToggle()">Show all ${filtered.length} sessions ↓</button>` : ''}
    `}
  </div>`;
}

      <div class="form-field" style="margin-bottom:14px">
        <label>Notes <span style="color:var(--text-3);font-weight:400">(optional)</span></label>
        <textarea id="rec-note" rows="2" placeholder="e.g. 45 min Zone 2 cycling…" style="resize:none"></textarea>
      </div>
      <div class="rec-sheet-row">
        <button class="rec-sheet-cancel" onclick="recCloseSheet()">Cancel</button>
        <button class="rec-sheet-save" id="rec-save-btn" onclick="recSave()">Save Session</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) recCloseSheet(); });

  // Pull-down to dismiss
  const sheet = document.getElementById('rec-sheet');
  let dragStartY = 0, dragging = false;
  sheet.addEventListener('touchstart', e => {
    if (sheet.scrollTop > 0) return;
    dragStartY = e.touches[0].clientY;
    dragging = true;
  }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (!dragging) return;
    const dy = e.touches[0].clientY - dragStartY;
    if (dy > 0) sheet.style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  sheet.addEventListener('touchend', e => {
    if (!dragging) return;
    dragging = false;
    const dy = e.changedTouches[0].clientY - dragStartY;
    if (dy > 80) { recCloseSheet(); } else { sheet.style.transform = ''; }
  }, { passive: true });
}

async function recPhotoSelected(input) {
  const file = input.files[0];
  if (!file) return;
  const key = localStorage.getItem('hd_claude_key');

  // Extract EXIF date before resizing (needs raw buffer)
  try {
    const buf  = await file.arrayBuffer();
    const fp   = await recFingerprint(buf);
    const dupId = recDuplicateId(fp);
    if (dupId) {
      toast('This photo has already been imported', true);
      input.value = '';
      return;
    }
    const exif = parseExifDate(extractExifDate(buf));
    if (exif) {
      const [y, m, d] = exif.date.split('-');
      const dayEl = document.getElementById('rec-day');   if (dayEl)   dayEl.value = d;
      const monEl = document.getElementById('rec-month'); if (monEl)   monEl.value = m;
      const yrEl  = document.getElementById('rec-year');  if (yrEl)    yrEl.value  = y;
      const dBtn  = document.getElementById('rdb-day');   if (dBtn)    dBtn.querySelector('.rec-date-btn-val').textContent = d;
      const mBtn  = document.getElementById('rdb-month'); if (mBtn)    mBtn.querySelector('.rec-date-btn-val').textContent = REC_MONTHS[parseInt(m)-1];
      const yBtn  = document.getElementById('rdb-year');  if (yBtn)    yBtn.querySelector('.rec-date-btn-val').textContent = y;
      window._recState.exif = exif;
    }
    window._recState.fingerprint = fp;
  } catch(e) { /* EXIF read failed — leave date as today */ }

  const thumb_small = await recResizeImage(file, 1600, 0.88);
  window._recState.thumb    = thumb_small.dataUrl; // kept in memory for preview only
  window._recState.hasPhoto = true;
  const preview   = document.getElementById('rec-preview');
  const photoArea = document.getElementById('rec-photo-area');
  if (preview)   { preview.src = thumb_small.dataUrl; preview.style.display = 'block'; }
  if (photoArea) photoArea.style.display = 'none';
  if (!key) return;
  const box     = document.getElementById('rec-analysis-box');
  const saveBtn = document.getElementById('rec-save-btn');
  if (box) { box.style.display = ''; box.innerHTML = '<div style="display:flex;align-items:center;gap:8px;color:var(--text-3);font-size:12px"><div class="ai-loading" style="padding:0"><span></span><span></span><span></span></div>Analysing with Claude…</div>'; }
  if (saveBtn) saveBtn.disabled = true;
  const api_img = await recResizeImage(file, 512, 0.82);
  const t0 = Date.now();
  let httpStatus = null, requestId = null;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({
        model: 'claude-opus-4-8',
        max_tokens: 400,
        messages: [{ role: 'user', content: [
          { type: 'image', source: { type: 'base64', media_type: api_img.mediaType, data: api_img.b64 } },
          { type: 'text', text: `You are a coach for Mike Mentzer's Heavy Duty training — HIT means Heavy Duty high-intensity weight training, NOT HIIT cardio. This photo shows an ACTIVE RECOVERY session (light cardio or movement done between heavy weight training sessions to aid recovery). Analyse the photo and respond with ONLY raw JSON, no markdown:\n{"activity":"short activity name e.g. Cycling / Walking / Swimming","zone":"e.g. Zone 2 / Light / Moderate","duration":"estimated or visible duration, or null","observations":"1 concise sentence describing what you see","recommendation":"1 sentence on how this active recovery session supports recovery from heavy compound weight training"}` }
        ]}]
      })
    });
    httpStatus = res.status;
    requestId  = res.headers.get('request-id') || res.headers.get('x-request-id') || '';
    if (!res.ok) { const t = await res.text(); throw new Error((() => { try { return JSON.parse(t).error?.message || `HTTP ${res.status}`; } catch(e) { return `HTTP ${res.status}`; } })()); }
    const data = await res.json();
    const raw  = (data.content || []).find(b => b.type === 'text')?.text || '';
    const m    = raw.replace(/```[a-z]*\n?/gi,'').trim().match(/\{[\s\S]*\}/);
    const parsed = m ? JSON.parse(m[0]) : null;
    if (!parsed) throw new Error('Could not parse response');
    window._recState.analysis = parsed;
    aiLogPush({ source: 'recovery', status: httpStatus, requestId, durationMs: Date.now()-t0, activity: parsed.activity, zone: parsed.zone });
    if (box) box.innerHTML = `<strong>${parsed.activity}${parsed.zone ? ' · '+parsed.zone : ''}${parsed.duration ? ' · '+parsed.duration : ''}</strong><br>${parsed.observations}<span class="rec-analysis-rec">${parsed.recommendation}</span>`;
  } catch(err) {
    aiLogPush({ source: 'recovery', status: httpStatus, requestId, durationMs: Date.now()-t0, error: err.message });
    if (box) box.innerHTML = `<span style="color:var(--text-3);font-size:12px">Analysis unavailable — ${err.message}</span>`;
  } finally {
    if (saveBtn) saveBtn.disabled = false;
  }
}

async function recSave() {

function recResizeImage(file, maxPx, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width  = Math.round(img.width  * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve({ dataUrl, b64: dataUrl.split(',')[1], mediaType: 'image/jpeg' });
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  const lsSize = Object.keys(localStorage).reduce((acc, k) => acc + (localStorage.getItem(k)||'').length, 0);

function aiRenderLog() {
  const panel = document.getElementById('ai-log-panel');

  const tabs = `<div style="display:flex;border-bottom:1px solid var(--border)">${tabBtn('log','API Log')}${tabBtn('state','State')}</div>`;

  if (tab === 'state') {
    aiTestConnection();
    panel.innerHTML = tabs + aiDebugState();
    return;
  }

  const entries = !window._aiLog.length
    ? '<div style="padding:12px 16px;font-size:12px;color:var(--text-3)">No API calls yet.</div>'
    : window._aiLog.map(e => {
        const ok     = e.status >= 200 && e.status < 300;
        const colour = ok ? 'var(--green)' : 'var(--accent)';
        const badge  = e.source === 'recovery' ? '<span style="font-size:9px;background:#1a4a2e;color:#4ade80;padding:1px 5px;border-radius:2px;margin-right:6px;font-weight:700">REC</span>' : '<span style="font-size:9px;background:#3a1010;color:var(--accent);padding:1px 5px;border-radius:2px;margin-right:6px;font-weight:700">AI</span>';
        const summary = `${e.ts.slice(11,19)}  HTTP ${e.status||'—'}  ${e.durationMs ? e.durationMs+'ms' : ''}`;
        const detail  = JSON.stringify(e, null, 2).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        return `<div style="border-bottom:1px solid var(--border);padding:10px 14px">
          <div style="font-size:11px;font-family:monospace;color:${colour};margin-bottom:4px">${badge}${summary}</div>
          ${e.error ? `<div style="font-size:12px;color:var(--accent);margin-bottom:4px">${e.error}</div>` : ''}
          ${e.activity ? `<div style="font-size:11px;color:var(--text-2);margin-bottom:4px">↳ ${e.activity}${e.zone?' · '+e.zone:''}</div>` : ''}
          <details><summary style="font-size:11px;color:var(--text-3);cursor:pointer">Raw</summary>
          <pre style="font-size:10px;color:var(--text-2);white-space:pre-wrap;word-break:break-all;margin-top:6px;max-height:200px;overflow-y:auto">${detail}</pre></details>
        </div>`;
      }).join('');

  panel.innerHTML = tabs + entries;
}

    httpStatus = res.status;

    if (!res.ok) {
      const errText = await res.text();
      let msg;
      try { msg = JSON.parse(errText).error?.message || `HTTP ${res.status}`; }
      catch(e) { msg = `HTTP ${res.status}: ${errText.slice(0,200)}`; }

    // Prepare streaming response box — show it immediately so user sees activity
    area.innerHTML = `<div class="ai-response-box"><div class="ai-thinking-indicator">
      <div class="ai-loading"><span></span><span></span><span></span></div>

    const streamOut  = document.getElementById('ai-stream-out');
    const thinkingEl = area.querySelector('.ai-thinking-indicator');

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let inTextBlock = false;
    let usage = {};
    let stopReason = null;
    let blockTypes = [];
    let currentBlockType = null;
    let buf = '';

    outer: while (true) {
      const { done, value } = await reader.read();

      buf += decoder.decode(value, { stream: true });

            break;
          case 'content_block_stop':
            if (currentBlockType === 'text') inTextBlock = false;
            currentBlockType = null;
            break;
          case 'message_delta':
            stopReason = evt.delta?.stop_reason;
            if (evt.usage) Object.assign(usage, evt.usage);
            break;
          case 'message_start':
            if (evt.message?.usage) Object.assign(usage, evt.message.usage);

function aiMarkdown(md) {
  // Escape HTML
  let s = md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Bold / italic
  s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g,'<em>$1</em>');
  // Headers (##, ###, #)
  s = s.replace(/^#{1,3} (.+)$/gm,'<h4>$1</h4>');
  // Lists — process line-by-line
  const lines = s.split('\n');
  const out = []; let inList = false;
  for (const line of lines) {
    const m = line.match(/^[-•*]\s+(.+)$/);
    if (m) {
      if (!inList) { out.push('<ul>'); inList = true; }
      out.push(`<li>${m[1]}</li>`);
    } else {
      if (inList) { out.push('</ul>'); inList = false; }
      out.push(line);
    }
  }
  if (inList) out.push('</ul>');
  // Paragraphs
  const joined = out.join('\n');
  const paras = joined.split(/\n{2,}/).map(p => {
    const t = p.trim();
    if (!t || t.startsWith('<h4') || t.startsWith('<ul') || t.startsWith('<li')) return t;
    return `<p>${t.replace(/\n/g,'<br>')}</p>`;
  });
  return paras.join('\n');
}

const GD_CLIENT_ID = '485160115881-567lvkbcajarokqitjbqroqrreruc9eh.apps.googleusercontent.com';
const GD_SCOPE     = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';
const GD_FILENAME  = 'HeavyDuty-backup.json';

let gdTokenClient = null;
let gdBackupTimer = null;

function gdLoad() {
  if (window.google?.accounts?.oauth2) { gdInitClient(); return; }
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = gdInitClient;
  s.onerror = () => toast('Could not load Google Sign-In', true);
  document.head.appendChild(s);
}

function gdInitClient() {
  gdTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GD_CLIENT_ID,
    scope: GD_SCOPE,
    callback: gdHandleToken,
  });
}

function gdHandleToken(resp) {
  if (resp.error) { toast('Google: ' + resp.error, true); return; }
  const expiry = Date.now() + (resp.expires_in - 120) * 1000;
  localStorage.setItem('hd_gd_token',  resp.access_token);
  localStorage.setItem('hd_gd_expiry', String(expiry));
  // Fetch email for display
  fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
    headers: { Authorization: 'Bearer ' + resp.access_token }
  }).then(r => r.json()).then(u => {
    if (u.email) localStorage.setItem('hd_gd_email', u.email);
    if (cur === 'settings') renderSettings();
    gdBackup();
  }).catch(() => {
    if (cur === 'settings') renderSettings();
    gdBackup();
  });
}

function gdConnect() {
  if (!window.google?.accounts?.oauth2) {
    gdLoad();
    // Wait for script then connect
    const wait = setInterval(() => {
      if (window.google?.accounts?.oauth2) {
        clearInterval(wait);
        gdInitClient();
        gdTokenClient.requestAccessToken({ prompt: 'select_account' });
      }
    }, 200);
  } else {
    if (!gdTokenClient) gdInitClient();
    gdTokenClient.requestAccessToken({ prompt: 'select_account' });
  }
}

function gdDisconnect() {
  const token = localStorage.getItem('hd_gd_token');
  if (token && window.google?.accounts?.oauth2) {
    google.accounts.oauth2.revoke(token, () => {});
  }
  ['hd_gd_token','hd_gd_expiry','hd_gd_email','hd_gd_file_id','hd_gd_last_backup'].forEach(k => localStorage.removeItem(k));
  if (cur === 'settings') renderSettings();
  toast('Google Drive disconnected', false);
}

function gdIsConnected() {
  return !!(localStorage.getItem('hd_gd_token') && Date.now() < parseInt(localStorage.getItem('hd_gd_expiry') || '0'));
}

function gdLastBackupStr() {
  const t = parseInt(localStorage.getItem('hd_gd_last_backup') || '0');
  if (!t) return 'Never backed up';
  const mins = Math.floor((Date.now() - t) / 60000);
  if (mins < 1)  return 'Backed up just now';
  if (mins < 60) return `Backed up ${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24)  return `Backed up ${hrs}h ago`;
  return `Backed up ${Math.floor(hrs/24)}d ago`;
}

async function gdGetValidToken() {
  const token  = localStorage.getItem('hd_gd_token');
  const expiry = parseInt(localStorage.getItem('hd_gd_expiry') || '0');
  if (token && Date.now() < expiry) return token;           // still valid
  if (!localStorage.getItem('hd_gd_email')) return null;   // never connected
  if (!window.google?.accounts?.oauth2) return null;        // GIS not loaded
  if (!gdTokenClient) gdInitClient();
  // Silent refresh — no UI shown; resolves null if session expired
  return new Promise(resolve => {
    const prev = gdTokenClient.callback;
    gdTokenClient.callback = resp => {
      gdTokenClient.callback = prev;
      if (resp.error || !resp.access_token) { resolve(null); return; }
      const exp = Date.now() + (resp.expires_in - 120) * 1000;
      localStorage.setItem('hd_gd_token',  resp.access_token);
      localStorage.setItem('hd_gd_expiry', String(exp));
      resolve(resp.access_token);
    };
    gdTokenClient.requestAccessToken({ prompt: '' });
  });
}

async function gdBackup(userInitiated = false) {
  const token = await gdGetValidToken();
  if (!token) {
    if (localStorage.getItem('hd_gd_email')) {
      if (userInitiated) {
        toast('Drive session expired — tap Connect to re-authenticate', true);
        localStorage.removeItem('hd_gd_token');
        localStorage.removeItem('hd_gd_expiry');
        localStorage.removeItem('hd_gd_email');
        localStorage.removeItem('hd_gd_pending');
        if (cur === 'settings') renderSettings();
      } else {
        // Background backup — token expired, don't pop up, just flag as pending
        localStorage.setItem('hd_gd_pending', '1');
        if (cur === 'settings') renderSettings();
      }
    }
    return;
  }

  const photos = await recGetAllPhotos();
  const body = JSON.stringify({ version: 3, exportedAt: new Date().toISOString(), profile: getProfile() || {}, workouts, recoveryLogs, photos }, null, 2);
  let fileId = localStorage.getItem('hd_gd_file_id');

  try {
    // First time: search Drive for an existing file
    if (!fileId) {
      const res = await fetch(
        `https://www.googleapis.com/drive/v3/files?q=name%3D'${GD_FILENAME}'+and+trashed%3Dfalse&fields=files(id)`,
        { headers: { Authorization: 'Bearer ' + token } }
      );
      const json = await res.json();
      if (json.files?.length) fileId = json.files[0].id;
    }

    const meta = JSON.stringify({ name: GD_FILENAME, mimeType: 'application/json' });
    const form = new FormData();
    form.append('metadata', new Blob([meta], { type: 'application/json' }));
    form.append('file',     new Blob([body], { type: 'application/json' }));

    const url    = fileId
      ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
      : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    const method = fileId ? 'PATCH' : 'POST';

    const resp = await fetch(url, { method, headers: { Authorization: 'Bearer ' + token }, body: form });
    if (!resp.ok) throw new Error(await resp.text());

    const file = await resp.json();
    localStorage.setItem('hd_gd_file_id',      file.id);
    localStorage.setItem('hd_gd_last_backup',   String(Date.now()));
    localStorage.removeItem('hd_gd_pending');
    toast('Backed up to Google Drive ✓', false);
    if (cur === 'settings') renderSettings();
  } catch (e) {
    console.error('Drive backup failed', e);
  }
}

function gdScheduleBackup() {
  clearTimeout(gdBackupTimer);
  gdBackupTimer = setTimeout(() => {
    if (gdIsConnected()) gdBackup();
    else if (localStorage.getItem('hd_gd_email')) { localStorage.setItem('hd_gd_pending', '1'); if (cur === 'settings') renderSettings(); }
  }, 4000);
}

// ── Calendar ──────────────────────────────────────────
let calMonth, calYear;
const CAL_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function showCalendar(dateStr) {
  const d = dateStr ? localMidnight(dateStr) : new Date();
  calMonth = d.getMonth();
  calYear  = d.getFullYear();
  renderCalendar();
  document.getElementById('cal-bg').classList.add('show');
  requestAnimationFrame(()=>document.getElementById('cal-sheet').classList.add('show'));
}

function hideCalendar() {
  const el = document.getElementById('cal-sheet');
  el.classList.remove('dragging');
  el.style.transform = '';
  el.classList.remove('show');
  document.getElementById('cal-bg').classList.remove('show');
}

// ── Calendar drag-to-dismiss ───────────────────────────
(function() {
  let startY = 0, curY = 0, dragging = false;

  function onStart(e) {
    const sheet = document.getElementById('cal-sheet');
    if (!sheet.classList.contains('show')) return;
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    curY = 0;
    dragging = true;
    sheet.classList.add('dragging');
  }

  function onMove(e) {
    if (!dragging) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    curY = Math.max(0, y - startY); // only allow downward drag
    document.getElementById('cal-sheet').style.transform = `translateY(${curY}px)`;
  }

  function onEnd() {
    if (!dragging) return;
    dragging = false;
    const sheet = document.getElementById('cal-sheet');
    sheet.classList.remove('dragging');
    if (curY > 80) {
      hideCalendar();
    } else {
      sheet.style.transform = '';
    }
  }

  document.addEventListener('touchstart', e => {
    if (e.target.closest('#cal-sheet')) onStart(e);
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (dragging) onMove(e);
  }, { passive: true });
  document.addEventListener('touchend', onEnd);
})();

function calNav(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0)  { calMonth = 11; calYear--; }
  renderCalendar();
}

function renderCalendar() {
  const todayStr = today();
  const byDate = {};
  workouts.forEach(w => { byDate[w.date] = w; });

  const firstDow = new Date(calYear, calMonth, 1).getDay(); // 0=Sun
  const startOffset = (firstDow + 6) % 7; // shift to Mon=0
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

  let cells = '';
  for (let i = 0; i < startOffset; i++) cells += `<div class="cal-cell"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = ds === todayStr;
    const w = byDate[ds];
    let cls = 'cal-cell cal-day';
    if (isToday)  cls += ' cal-today';
    if (w)        cls += ' cal-workout';
    const tap = w ? `onclick="hideCalendar();go('detail',{id:'${w.id}'})"` : '';
    cells += `<div class="${cls}" ${tap}><span>${d}</span>${w?'<div class="cal-workout-dot"></div>':''}</div>`;
  }

  document.getElementById('cal-body').innerHTML = `
    <div class="cal-header">
      <button class="cal-nav" onclick="calNav(-1)"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <div class="cal-month-label">${CAL_MONTHS[calMonth]} ${calYear}</div>
      <button class="cal-nav" onclick="calNav(1)">${SVG.chev}</button>
    </div>
    <div class="cal-dow"><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div></div>
    <div class="cal-grid">${cells}</div>
  `;
}

function showSheet(title, msg, okLabel, onOk) {
  document.getElementById('sh-title').textContent = title;
  document.getElementById('sh-msg').textContent = msg;
  const ok = document.getElementById('sh-ok');
  ok.textContent = okLabel; ok.onclick = onOk;
  document.getElementById('sheet-bg').classList.add('show');
  requestAnimationFrame(()=>document.getElementById('sheet').classList.add('show'));
}
function hideSheet() {
  document.getElementById('sheet').classList.remove('show');
  document.getElementById('sheet-bg').classList.remove('show');
}

// ── Sheet drag-to-dismiss ──────────────────────────────
(function() {
  let startY = 0, curY = 0, dragging = false;

  function onStart(e) {
    const sheet = document.getElementById('sheet');
    if (!sheet.classList.contains('show')) return;
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    curY = 0;
    dragging = true;
    sheet.classList.add('dragging');
  }

  function onMove(e) {
    if (!dragging) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    curY = Math.max(0, y - startY);
    document.getElementById('sheet').style.transform = `translateY(${curY}px)`;
  }

  function onEnd() {
    if (!dragging) return;
    dragging = false;
    const sheet = document.getElementById('sheet');
    sheet.classList.remove('dragging');
    if (curY > 80) {
      sheet.style.transform = '';
      hideSheet();
    } else {
      sheet.style.transform = '';
    }
  }

  document.addEventListener('touchstart', e => {
    if (e.target.closest('#sheet')) onStart(e);
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (dragging) onMove(e);
  }, { passive: true });
  document.addEventListener('touchend', onEnd);
})();

let _tid;
function toast(msg, err, duration = 2500) {
  const t = document.getElementById('toast');
  document.getElementById('t-dot').style.background = err ? 'var(--red)' : 'var(--green)';
  document.getElementById('t-msg').textContent = msg;
  t.classList.add('show');
  clearTimeout(_tid);
  if (duration > 0) _tid = setTimeout(() => t.classList.remove('show'), duration);
}

}
function loadWkMods() {
  try { wkMods = JSON.parse(localStorage.getItem('hd_wk_mods') || '{}'); } catch(e) { wkMods = {}; }
}
function loadWkModAnalysis() {
  try { wkModAnalysis = JSON.parse(localStorage.getItem('hd_wk_analysis') || '{}'); } catch(e) { wkModAnalysis = {}; }
}

function saveCustomWks() {
  localStorage.setItem('hd_custom_wks', JSON.stringify(customWks));
}
function getCustomWk(id) {
  return customWks.find(w => w.id === id) || null;
}
function resolveWk(type) {
  const base = WK[type];
  if (base) {
    if (wkMods[type]) return { ...base, exs: wkMods[type], desc: wkMods[type].slice(0,2).join(' & ') };

  const cw = getCustomWk(type);
  return cw ? { label: cw.name, short: 'CX', desc: cw.exs.slice(0,2).join(' & '), method: 'custom', exs: cw.exs } : null;

// ── Touch drag-to-reorder for exercise list ──────────────
let _cwDrag = null;

function cwDragStart(e, idx) {
  if (_cwDrag) return;
  const touch = e.touches[0];
  // Don't preventDefault here — lets button taps fall through until threshold crossed
  _cwDrag = { idx, curIdx: idx, startY: touch.clientY, ghostTop: null, row: e.currentTarget, started: false };
  document.addEventListener('touchmove', cwDragMove, { passive: false });
  document.addEventListener('touchend',  cwDragEnd,  { once: true });
}

function cwDragMove(e) {
  if (!_cwDrag) return;
  const touch = e.touches[0];
  const dy = touch.clientY - _cwDrag.startY;

  if (!_cwDrag.started) {
    if (Math.abs(dy) < 8) return; // under threshold — don't swallow the event
    // Threshold crossed — begin visual drag
    _cwDrag.started = true;
    const row = _cwDrag.row;
    const rect = row.getBoundingClientRect();
    const ghost = row.cloneNode(true);
    ghost.id = 'cw-drag-ghost';
    ghost.className = 'cw-drag-ghost-el'; // NOT cw-ex-row — avoids selector pollution
    ghost.style.cssText = `position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;z-index:9999;pointer-events:none;background:var(--surface-2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.6);opacity:0.96;`;
    document.body.appendChild(ghost);
    row.classList.add('drag-source');
    _cwDrag.ghostTop = rect.top;
  }

  e.preventDefault();
  const y = touch.clientY;
  const ghost = document.getElementById('cw-drag-ghost');
  if (ghost) ghost.style.top = (_cwDrag.ghostTop + y - _cwDrag.startY) + 'px';

  const rows = Array.from(document.querySelectorAll('.cw-ex-row:not(.drag-source)'));
  rows.forEach(r => r.classList.remove('drag-over'));
  let ti = window._cwFormExs.length;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i].getBoundingClientRect();
    if (y < r.top + r.height / 2) {
      rows[i].classList.add('drag-over');
      const name = rows[i].querySelector('.cw-ex-name')?.textContent?.trim() || '';
      const fi = window._cwFormExs.indexOf(name);
      ti = fi !== -1 ? fi : window._cwFormExs.length;
      break;
    }
  }
  _cwDrag.curIdx = ti;
}

function _cwDragCleanup() {
  document.removeEventListener('touchmove', cwDragMove);
  document.removeEventListener('touchend',  cwDragEnd);
  document.getElementById('cw-drag-ghost')?.remove();
  document.querySelectorAll('.cw-ex-row').forEach(r => r.classList.remove('drag-source','drag-over'));
  _cwDrag = null;
}

function cwDragEnd() {
  if (!_cwDrag) return;
  const { idx, curIdx, started } = _cwDrag;
  _cwDragCleanup();

  if (started && idx !== curIdx) {
    const exs = window._cwFormExs;
    const [moved] = exs.splice(idx, 1);
    const dest = Math.max(0, Math.min(curIdx > idx ? curIdx - 1 : curIdx, exs.length));
    exs.splice(dest, 0, moved);
    _cwSaveName();
    _renderCustomWkForm(window._cwFormName, window._cwFormExs);
  }
}

function cwFormRemoveEx(i) {
  _cwSaveName();
  window._cwFormExs.splice(i, 1);
  _renderCustomWkForm(window._cwFormName, window._cwFormExs);
}

function cwFormSave() {
  if (!window._cwFormExs.length) { toast('Add at least one exercise', true); return; }
  if (_cwFormIsBuiltIn) {
    const type = _cwFormId;
    wkMods[type] = [...window._cwFormExs];
    saveWkMods();
    closeCustomWkForm();
    renderHome();
    toast('Workout updated', false);
    // Trigger Mentzer AI analysis if key available
    if (localStorage.getItem('hd_claude_key')) {
      delete wkModAnalysis[type]; // clear stale analysis
      saveWkModAnalysis();
      setTimeout(() => showWkModAnalysis(type), 400);
    }
    return;
  }
  const name = (document.getElementById('cw-wktitle')?.textContent || '').trim();
  if (!name) { toast('Please name your workout', true); return; }
  if (_cwFormId) {
    const w = getCustomWk(_cwFormId);
    if (w) { w.name = name; w.exs = window._cwFormExs; }
  } else {
    customWks.push({ id: 'CX_' + uid(), name, exs: window._cwFormExs });
  }
  saveCustomWks();
  closeCustomWkForm();
  renderHome();
  if (cur === 'settings') renderSettings();
  toast(_cwFormId ? 'Workout updated' : 'Custom workout created', false);
}

function cwFormDelete() {
  if (!_cwFormId) return;
  if (_cwFormIsBuiltIn) {
    delete wkMods[_cwFormId];
    saveWkMods();
    closeCustomWkForm();
    renderHome();
    if (cur === 'settings') renderSettings();
    toast('Reset to default', false);
    return;
  }
  customWks = customWks.filter(w => w.id !== _cwFormId);
  saveCustomWks();
  closeCustomWkForm();
  renderHome();
  if (cur === 'settings') renderSettings();
  toast('Workout deleted', false);
}

  _cwDragCleanup();
  document.getElementById('custom-form-overlay')?.remove();

function closeWkModAnalysis() {

function showWkModAnalysis(type) {
  const key = localStorage.getItem('hd_claude_key');
  if (!key) return;

  const original = WK[type];
  const modified = wkMods[type] || original.exs;
  const cached   = wkModAnalysis[type];

  let el = document.getElementById('wkmod-analysis-overlay');
  if (!el) {
    el = document.createElement('div');
    el.id = 'wkmod-analysis-overlay';
    el.className = 'wkmod-analysis-overlay';
    document.body.appendChild(el);
  }

  const bodyId  = 'wkmod-analysis-body';
  const textId  = 'wkmod-analysis-text';
  const closeX  = `<button onclick="closeWkModAnalysis()" style="background:none;border:none;color:var(--text-3);cursor:pointer;padding:4px;line-height:0">${SVG.x}</button>`;

  el.innerHTML = `
    <div class="wkmod-analysis-sheet">
      <div class="wkmod-analysis-head">
        <div>
          <div class="wkmod-analysis-title">Mentzer's Verdict</div>
          <div class="wkmod-analysis-subtitle">${original.label}</div>
        </div>
        ${closeX}
      </div>
      <div class="wkmod-analysis-body" id="${bodyId}">
        ${cached
          ? `<div class="wkmod-analysis-text" id="${textId}">${_renderAnalysisMarkdown(cached)}</div>`
          : `<div class="wkmod-analysis-loading" id="${textId}">
               <div class="wkmod-analysis-loading-dot"></div>
               <div class="wkmod-analysis-loading-dot"></div>
               <div class="wkmod-analysis-loading-dot"></div>
               <span>Analysing with Claude…</span>
             </div>`}
      </div>
      <div class="wkmod-analysis-footer">
        <button class="btn-save" style="margin:0;width:100%" onclick="closeWkModAnalysis()">Got it</button>
        ${cached ? `<div class="wkmod-analysis-warn">Tap the AI chip on the workout row to re-analyse</div>` : ''}
      </div>
    </div>`;

  if (!cached) _streamWkModAnalysis(type, key, original, modified, textId);
}

function _renderAnalysisMarkdown(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^#{1,3}\s+(.+)$/gm, '<strong style="font-size:13px;color:var(--text);display:block;margin:12px 0 4px">$1</strong>')
    .replace(/^[-•]\s+(.+)$/gm, '<span style="display:block;padding-left:14px;position:relative"><span style="position:absolute;left:0">•</span>$1</span>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

async function _streamWkModAnalysis(type, key, original, modified, textId) {
  const removed = original.exs.filter(e => !modified.includes(e));
  const added   = modified.filter(e => !original.exs.includes(e));
  const kept    = original.exs.filter(e => modified.includes(e));

  const changeDesc = [
    kept.length    ? `Kept: ${kept.join(', ')}`    : '',
    removed.length ? `Removed: ${removed.join(', ')}` : '',
    added.length   ? `Added: ${added.join(', ')}`   : '',
  ].filter(Boolean).join('\n');

  const prompt = `A user has modified their ${original.label} workout from Mike Mentzer's Heavy Duty programme.

**Original Mentzer prescription:**
${original.exs.join(', ')}

**User's modified version:**
${modified.join(', ')}

**Changes made:**
${changeDesc}

Analyse this modification under Mike Mentzer's Heavy Duty / HIT principles. Be direct, specific, and honest — if they've made sound changes that align with HIT principles, validate them. If they've deviated (too much volume, poor sequencing, conflicting muscle groups, isolation before compound, etc.), call it out clearly and explain why. Keep it under 180 words. No generic preamble.`;

  let fullText = '';
  const textEl = document.getElementById(textId);

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
        'content-type': 'application/json',
      },
      body: JSON.stringify({
        model: 'claude-opus-4-8',
        max_tokens: 700,
        stream: true,
        messages: [{ role: 'user', content: prompt }],
      }),
    });

    if (!res.ok) throw new Error(`API error ${res.status}`);

    const reader = res.body.getReader();
    const dec    = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const d = JSON.parse(line.slice(6));
          if (d.type === 'content_block_delta' && d.delta?.type === 'text_delta') {
            fullText += d.delta.text;
            if (textEl) {
              if (textEl.className !== 'wkmod-analysis-text') {
                textEl.className = 'wkmod-analysis-text';
              }
              textEl.innerHTML = _renderAnalysisMarkdown(fullText);
            }
          }
        } catch {}
      }
    }

    if (fullText) {
      wkModAnalysis[type] = fullText;
      saveWkModAnalysis();
      renderHome(); // refresh ANALYSIS chip on home row
    }
  } catch (err) {
    if (textEl) textEl.innerHTML = `<span style="color:var(--accent)">Analysis failed — check your API key in Settings.</span>`;
  }
}

loadCustomWks();
loadWkMods();

let _installPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _installPrompt = e;
  document.querySelectorAll('.install-app-row').forEach(el => el.style.display = 'flex');
});
window.addEventListener('appinstalled', () => { _installPrompt = null; });

async function promptInstall() {
  if (!_installPrompt) return;
  _installPrompt.prompt();
  const { outcome } = await _installPrompt.userChoice;
  if (outcome === 'accepted') _installPrompt = null;
}
