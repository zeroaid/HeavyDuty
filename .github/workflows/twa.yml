name: Build TWA APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'twa-app/**'
      - 'manifest.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore twa-app/keystore.jks \
            -alias heavyduty \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Heavy Duty, O=ZeroAid, C=GB" \
            -storepass heavyduty2024 \
            -keypass heavyduty2024

      - name: Print SHA-256 fingerprint
        run: |
          echo "====== COPY THIS INTO .well-known/assetlinks.json ======"
          keytool -list -v -keystore twa-app/keystore.jks \
            -alias heavyduty -storepass heavyduty2024 | grep "SHA256:"
          echo "========================================================"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: twa-app
        run: gradle assembleRelease
        env:
          KEYSTORE_PATH: ../keystore.jks
          STORE_PASSWORD: heavyduty2024
          KEY_ALIAS: heavyduty
          KEY_PASSWORD: heavyduty2024

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: heavy-duty-twa-v${{ github.run_number }}
          path: twa-app/app/build/outputs/apk/release/*.apk

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twa-v${{ github.run_number }}
          name: "Heavy Duty TWA v${{ github.run_number }}"
          body: |
            ## Install
            1. Download `app-release.apk`
            2. Settings → Security → Install unknown apps → allow your file manager
            3. Open the APK and tap Install
            4. The nav bar is now black — no more white bar
          files: twa-app/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
