name: Build TWA APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'twa-manifest.json'
      - 'manifest.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Pre-configure Bubblewrap (skip JDK install prompt)
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" \
            > ~/.bubblewrap/config.json

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore heavyduty.jks \
            -alias heavyduty \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Heavy Duty, O=ZeroAid, C=GB" \
            -storepass heavyduty2024 \
            -keypass heavyduty2024

      - name: Print SHA-256 fingerprint
        run: |
          echo "====== COPY THIS INTO .well-known/assetlinks.json ======"
          keytool -list -v -keystore heavyduty.jks -alias heavyduty \
            -storepass heavyduty2024 | grep "SHA256:"
          echo "========================================================"

      - name: Init TWA project (pipe defaults to all prompts)
        run: |
          mkdir twa-project && cd twa-project
          yes '' | bubblewrap init \
            --manifest https://zeroaid.github.io/HeavyDuty/manifest.json \
            --directory .
        continue-on-error: true

      - name: Patch twa-manifest with navigation colours
        run: |
          cd twa-project
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('twa-manifest.json','utf8'));
            m.navigationColor = '#000000';
            m.navigationColorDark = '#000000';
            m.navigationDividerColor = '#000000';
            m.navigationDividerColorDark = '#000000';
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
            console.log('Patched navigation colours');
          "

      - name: Build APK
        run: |
          cd twa-project
          yes '' | bubblewrap build \
            --skipPwaValidation \
            --keystore ../heavyduty.jks \
            --keystorePassword heavyduty2024 \
            --keyAlias heavyduty \
            --keyPassword heavyduty2024

      - name: Find and upload APK
        run: find . -name "*.apk" | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: heavy-duty-twa-v${{ github.run_number }}
          path: "**/*.apk"
          if-no-files-found: warn

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twa-v${{ github.run_number }}
          name: "Heavy Duty TWA v${{ github.run_number }}"
          body: |
            ## Install Instructions
            1. Download `app-release-signed.apk`
            2. On your S26 Ultra: Settings → Security → Install unknown apps → allow your file manager
            3. Open the APK and install
            4. The nav bar will now be black
          files: "**/*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
