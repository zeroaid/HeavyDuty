name: Build TWA APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'twa-app/**'
      - 'manifest.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using stored keystore from KEYSTORE_BASE64 secret"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > twa-app/keystore.jks
          else
            echo "Generating new keystore — save the base64 output below as KEYSTORE_BASE64 secret"
            keytool -genkey -v \
              -keystore twa-app/keystore.jks \
              -alias heavyduty \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Heavy Duty, O=ZeroAid, C=GB" \
              -storepass heavyduty2024 \
              -keypass heavyduty2024
            echo ""
            echo "====== SAVE THIS AS KEYSTORE_BASE64 GITHUB SECRET ======"
            base64 -w0 twa-app/keystore.jks
            echo ""
            echo "========================================================"
          fi

      - name: Print SHA-256 fingerprint
        run: |
          echo "====== SHA-256 (already in .well-known/assetlinks.json) ======"
          keytool -list -v -keystore twa-app/keystore.jks \
            -alias heavyduty -storepass heavyduty2024 | grep "SHA256:"
          echo "==============================================================="

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: twa-app
        run: gradle assembleRelease
        env:
          KEYSTORE_PATH: ../keystore.jks
          STORE_PASSWORD: heavyduty2024
          KEY_ALIAS: heavyduty
          KEY_PASSWORD: heavyduty2024

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: heavy-duty-twa-v${{ github.run_number }}
          path: twa-app/app/build/outputs/apk/release/*.apk

      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: twa-app/keystore.jks

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twa-v${{ github.run_number }}
          name: "Heavy Duty TWA v${{ github.run_number }}"
          body: |
            ## Install
            1. Download `app-release.apk`
            2. Settings → Security → Install unknown apps → allow your file manager
            3. Open the APK and tap Install
            4. The nav bar is now black — no more white bar
          files: twa-app/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
