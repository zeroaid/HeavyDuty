name: Check YouTube Links

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday 9am UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check YouTube video links
        id: check
        run: |
          # Extract all direct YouTube video URLs from index.html
          grep -oE "https://www\.youtube\.com/(watch\?v=|shorts/)[A-Za-z0-9_-]+" index.html \
            | sort -u > /tmp/urls.txt

          echo "Found $(wc -l < /tmp/urls.txt) direct YouTube links"
          dead=""

          while IFS= read -r url; do
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://www.youtube.com/oembed?url=${url}&format=json")
            if [ "$status" != "200" ]; then
              dead="${dead}- ${url} (HTTP ${status})\n"
              echo "DEAD: $url ($status)"
            else
              echo "  OK: $url"
            fi
            sleep 1
          done < /tmp/urls.txt

          if [ -n "$dead" ]; then
            {
              echo "dead_links<<EOF"
              echo -e "$dead"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "has_dead=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dead=false" >> "$GITHUB_OUTPUT"
            echo "All links OK"
          fi

      - name: Create issue for dead links
        if: steps.check.outputs.has_dead == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const dead = `${{ steps.check.outputs.dead_links }}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dead-link',
              per_page: 1,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Weekly re-check — these links are still dead:\n\n${dead}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Dead YouTube video links detected',
                body: `The weekly link checker found broken YouTube videos in \`index.html\`:\n\n${dead}\nReplace with search query fallbacks (\`_YT+'heavy+duty+college+...'\`) or find replacement videos.`,
                labels: ['dead-link'],
              });
            }
